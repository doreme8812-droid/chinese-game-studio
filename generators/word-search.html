!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中文找字游戏生成器 (Word Search Generator)</title>
<style id="kd-kids-theme">
/* 儿童类生成器统一风格 - 由中文游戏工坊注入（外壳统一：圆润中文字体 + 标题品牌色；玩法区与对错配色不动） */
:root{
  --kd-primary:#FF7A45;
  --kd-primary-d:#E85C2A;
}
body{
  font-family:'Varela Round','Noto Sans TC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif !important;
}
h1,.title,.brand-title,.app-title,header h1,.header-title,.app-header h1{
  color:var(--kd-primary-d) !important;
}
</style>

    
    <!-- 引入 React 和 ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- 引入 Babel 用于解析 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 pinyin-pro 用于自动生成拼音 -->
    <script src="https://unpkg.com/pinyin-pro"></script>
    
    <!-- 引入字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background-color: #f3f4f6; 
        }
        .font-rounded { font-family: 'Varela Round', 'Microsoft YaHei', sans-serif; }
        
        /* 自定义滚动条 */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        @keyframes fade-in-up {
          from { opacity: 0; transform: translateY(20px); }
          to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up { animation: fade-in-up 0.5s ease-out; }

        @keyframes bounce-slow {
          0%, 100% { transform: translateY(-5%); }
          50% { transform: translateY(5%); }
        }
        .animate-bounce-slow { animation: bounce-slow 3s infinite ease-in-out; }
        
        .loading-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .animate-shake { animation: shake 0.4s; }
        
        @keyframes bounce-in { 0% { opacity: 0; transform: scale(0.3); } 50% { opacity: 1; transform: scale(1.05); } 70% { transform: scale(0.9); } 100% { transform: scale(1); } }
        .animate-bounce-in { animation: bounce-in 0.8s cubic-bezier(0.215, 0.610, 0.355, 1.000) both; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { pinyin } = pinyinPro;

        // --- 图标组件 ---
        const Icons = {
            Clock: ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
            RefreshCw: ({size=18, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>,
            Settings: ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.39a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>,

            CheckCircle: ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>,
            Star: ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>,
            Trophy: ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>,
            ArrowLeft: ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>,
            Type: ({size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>,
            Grid3X3: ({size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>,
            Download: ({size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>,
            XCircle: ({className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>,
            Info: ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>,
            Loader: ({size=16, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`loading-spin ${className}`}><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>,
            Wand2: ({size=16, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m19 2 2 2-2 2-2-2 2-2Z"/><path d="m13.2 13.2 1.4-1.4"/><path d="m2 22 13-13"/><path d="M22 2 2 22"/><path d="m16 9 3.3 3.3"/></svg>,
            ListPlus: ({size=16, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M11 12H3"/><path d="M16 6H3"/><path d="M16 18H3"/><path d="M18 9v6"/><path d="M21 12h-6"/></svg>,
            Trash2: ({size=12, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>,
            Shuffle: ({size=16, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l14.2-12.6c.8-1.1 2-1.7 3.3-1.7H22"/><path d="M2 6h1.4c1.3 0 2.5.6 3.3 1.7l14.2 12.6c.8 1.1 2 1.7 3.3 1.7H22"/></svg>
        };

        const COMMON_CHARS = "的一是在不了有和人这中大为上个国我以要他时来用们生到作地于出就分对成会可主发年动同工也能下过子说产种面而方后多定行学法所民得经十三之进着等部度家电力里如水化高自二理起小物现实加量都两体制机当使点从业本去把性好应开它合还因由其些然前外天政四日那社义事平形相全表间样与关各重新线内数正心反你明看原又么利比或但质气第向道命此变条只没结解问意建月公无系军很情者最立代想已通并提直题党程展五果料象员革位入常文总次品式活设及管特件长求老头基资边流路级少格山统必论院北光术马该领术传美先干口";
        
        const DIFFICULTY_SETTINGS = {
            easy: { multiplier: 1.5, label: '简单' },
            medium: { multiplier: 2.0, label: '中等' },
            hard: { multiplier: 2.5, label: '困难' },
        };

        const DEFAULT_WORDS = [
            { id: '1', chinese: '熊猫', pinyin: 'xióng māo', english: 'Panda', loading: false },
            { id: '2', chinese: '苹果', pinyin: 'píng guǒ', english: 'Apple', loading: false },
            { id: '3', chinese: '学校', pinyin: 'xué xiào', english: 'School', loading: false },
            { id: '4', chinese: '老师', pinyin: 'lǎo shī', english: 'Teacher', loading: false },
        ];

        const calculateGridSize = (difficulty, wordCount, maxWordLength) => {
            const multiplier = DIFFICULTY_SETTINGS[difficulty].multiplier;
            let size = Math.ceil(wordCount * multiplier);
            size = Math.max(size, maxWordLength, 8);
            return Math.min(size, 20);
        };

        // --- 核心生成函数 (生成独立的 HTML 字符串) ---
        const generateStandaloneHTML = (config) => {
            // 导出时不硬编码大小，而是导出计算逻辑
            // 清理掉 loading 状态再导出
            const cleanConfig = {
                ...config,
                words: config.words.map(({loading, ...rest}) => rest)
            };
            const configJson = JSON.stringify(cleanConfig).replace(/</g, '\\u003c');
            const commonChars = COMMON_CHARS;
            const difficultyLabel = DIFFICULTY_SETTINGS[config.difficulty].label;
            const isKids = config.theme === 'kids';
            
            const colors = isKids ? {
                bg: '#FFFBEB', text: '#0EA5E9', containerBorder: '#38BDF8', containerShadow: '#0EA5E9', cellBg: '#FFFFFF', cellBorder: '#FED7AA', cellText: '#9A3412', selectedBg: '#38BDF8', selectedBorder: '#0EA5E9', foundBg: '#34D399', foundBorder: '#10B981', errorBg: '#FB7185', errorBorder: '#F43F5E', btnPrimaryBg: '#FB7185', btnPrimaryBorder: '#E11D48', iconBg: '#E0F2FE', iconBorder: '#38BDF8', 
            } : {
                bg: '#F9FAFB', text: '#111827', containerBorder: '#E5E7EB', containerShadow: 'rgba(0,0,0,0.05)', cellBg: '#FFFFFF', cellBorder: '#E5E7EB', cellText: '#374151', selectedBg: '#3B82F6', selectedBorder: '#2563EB', foundBg: '#10B981', foundBorder: '#059669', errorBg: '#EF4444', errorBorder: '#DC2626', btnPrimaryBg: '#111827', btnPrimaryBorder: 'transparent', iconBg: '#000000', iconBorder: '#000000',
            };

            const cssLandingPage = isKids ? `#landing-page { border: 4px dashed ${colors.containerBorder}; box-shadow: 0 10px 0 ${colors.containerShadow}; }` : `#landing-page { border: 1px solid ${colors.containerBorder}; box-shadow: 0 10px 25px ${colors.containerShadow}; }`;
            const cssGridContainer = isKids ? `.grid-container { border: 4px dashed ${colors.containerBorder}; box-shadow: 0 10px 0 ${colors.containerShadow}; }` : `.grid-container { border: 1px solid ${colors.containerBorder}; box-shadow: 0 4px 6px ${colors.containerShadow}; }`;
            const cssSidebarCard = isKids ? `.sidebar-card { border: 4px dashed ${colors.containerBorder}; box-shadow: 0 10px 0 ${colors.containerShadow}; }` : `.sidebar-card { border: 1px solid ${colors.containerBorder}; box-shadow: 0 4px 6px ${colors.containerShadow}; }`;
            const cssResultPage = isKids ? `#result-page { border: 4px dashed ${colors.containerBorder}; box-shadow: 0 10px 0 ${colors.containerShadow}; }` : `#result-page { border: 1px solid ${colors.containerBorder}; box-shadow: 0 20px 25px ${colors.containerShadow}; }`;
            const cssResultBox = isKids ? `border: 2px dashed #FDE68A;` : `border: 1px solid #F3F4F6;`;
            const iconHTML = isKids ? `<div class="icon-container kids-icon"><span style="font-size: 3rem;">🐼</span></div>` : `<div class="icon-container adult-icon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" y1="20" x2="15" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line></svg></div>`;

            // 使用数组拼接，避免模板字符串内的 script 标签解析错误
            const htmlParts = [
                '<!DOCTYPE html>',
                '<html lang="zh-CN">',
                '<head>',
                '    <meta charset="UTF-8">',
                '    <meta name="viewport" content="width=device-width, initial-scale=1.0">',
                `    <title>${config.title}</title>`,
                '    <style>',
                '        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }',
                `        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; display: flex; flex-direction: column; min-height: 100vh; background-color: ${colors.bg}; transition: background 0.3s; }`,
                '        @import url("https://fonts.googleapis.com/css2?family=Varela+Round&display=swap");',
                isKids ? "body { font-family: 'Varela Round', 'Microsoft YaHei', sans-serif; }" : "",
                '        .page-wrapper { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; padding: 20px; }',
                '        .container { max-width: 900px; width: 100%; display: flex; flex-direction: column; align-items: center; }',
                '        #landing-page { text-align: center; background: white; border-radius: 24px; max-width: 500px; width: 90%; padding: 40px; margin-bottom: 20px; }',
                cssLandingPage,
                `        .icon-container { margin: 0 auto 24px auto; display: flex; align-items: center; justify-content: center; }`,
                `        .kids-icon { width: 7rem; height: 7rem; background-color: ${colors.iconBg}; border-radius: 9999px; border: 4px solid ${colors.iconBorder}; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); animation: bounce-slow 3s infinite ease-in-out; }`,
                `        .adult-icon { width: 4rem; height: 4rem; background-color: ${colors.iconBg}; color: white; border-radius: 0.75rem; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }`,
                `        h1 { font-size: 2rem; margin-bottom: 12px; color: ${colors.text}; font-weight: bold; }`,
                `        .btn { display: inline-block; padding: 15px 40px; font-size: 1.2rem; border-radius: 12px; border: none; cursor: pointer; transition: transform 0.1s; margin-top: 20px; text-decoration: none; color: white; font-weight: bold; width: 100%; }`,
                '        .btn:active { transform: scale(0.95) translateY(2px); }',
                `        .btn-primary { background: ${colors.btnPrimaryBg}; ${isKids ? `border-bottom: 4px solid ${colors.btnPrimaryBorder};` : ''} }`,
                '        .difficulty-tag { display: inline-block; padding: 4px 16px; border-radius: 9999px; background-color: #F3F4F6; color: #6B7280; font-size: 0.875rem; font-weight: 600; margin-bottom: 32px; }',
                '        #game-page { display: none; width: 100%; max-width: 1000px; flex-direction: column; align-items: center; }',
                '        .header { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }',
                `        .timer { font-family: monospace; font-size: 1.5rem; background: white; padding: 8px 16px; border-radius: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); color: ${colors.cellText}; border: ${isKids ? `2px solid ${colors.cellBorder}` : `1px solid ${colors.containerBorder}`}; font-weight: bold; }`,
                '        .game-layout { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; width: 100%; }',
                '        .grid-container { background: white; padding: 20px; border-radius: 20px; }',
                cssGridContainer,
                `        .grid { display: grid; gap: 4px; }`,
                `        .cell { width: 35px; height: 35px; display: flex; justify-content: center; align-items: center; font-size: 1.2rem; cursor: pointer; border-radius: 6px; transition: all 0.2s; border: ${isKids ? '2px' : '1px'} solid ${colors.cellBorder}; background: ${colors.cellBg}; color: ${colors.cellText}; font-weight: ${isKids ? 'bold' : 'normal'}; }`,
                `        @media (max-width: 600px) { .cell { width: 28px; height: 28px; font-size: 0.9rem; } .grid { gap: 2px; } }`,
                '        @media (min-width: 768px) { .cell { width: 45px; height: 45px; font-size: 1.5rem; } }',
                `        .cell.selected { background: ${colors.selectedBg} !important; color: white !important; transform: scale(1.05); border-color: ${colors.selectedBorder} !important; z-index: 10; }`,
                `        .cell.found { background: ${colors.foundBg} !important; color: white !important; border-color: ${colors.foundBorder} !important; animation: pulse 0.5s; }`,
                `        .cell.error { background: ${colors.errorBg} !important; color: white !important; border-color: ${colors.errorBorder} !important; animation: shake 0.4s; }`,
                '        .sidebar { width: 100%; max-width: 300px; display: flex; flex-direction: column; gap: 10px; }',
                '        .sidebar-card { background: white; padding: 20px; border-radius: 20px; width: 100%; margin-bottom: 10px; }',
                cssSidebarCard,
                `        .word-card { background: white; padding: 12px; border-radius: 12px; border: 1px solid ${colors.containerBorder}; opacity: 0.9; transition: all 0.3s; margin-bottom: 8px; }`,
                `        .word-card.found { opacity: 0.5; text-decoration: line-through; background: #F0FDF4; border-color: ${colors.foundBorder}; color: ${colors.foundBorder}; }`,
                `        .pinyin { font-size: 1.1rem; font-weight: bold; color: ${colors.cellText}; font-family: monospace; }`,
                '        .english { font-size: 0.85rem; color: #6B7280; margin-top: 4px; border-top: 1px dashed #E5E7EB; padding-top: 4px; }',
                '        #result-page { display: none; text-align: center; background: white; border-radius: 24px; max-width: 500px; width: 90%; padding: 40px; }',
                cssResultPage,
                '        .footer { text-align: center; padding: 20px; color: #9CA3AF; font-size: 0.8rem; font-family: sans-serif; width: 100%; margin-top: auto; }',
                '        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }',
                '        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }',
                '        @keyframes bounce-slow { 0%, 100% { transform: translateY(-5%); } 50% { transform: translateY(5%); } }',
                '    </style>',
                '</head>',
                '<body>',
                '    <div class="page-wrapper">',
                '        <div class="w-full flex justify-center mb-6">',

                '                    let collision = false;',

                '',
                '        function checkSelection(start, end) {',
                '            const dx = Math.sign(end.x - start.x); const dy = Math.sign(end.y - start.y);',
                '            if (start.x !== end.x && start.y !== end.y && Math.abs(end.x - start.x) !== Math.abs(end.y - start.y)) { flashError([end]); return; }',
                '            const path = []; let cx = start.x; let cy = start.y;',
                '            while(true) { path.push({x: cx, y: cy}); if(cx === end.x && cy === end.y) break; cx += dx; cy += dy; }',
                '            const selectedStr = path.map(p => grid[p.y][p.x].char).join("");',

                '            if (match) {',
                '                foundWords.push(match.id);',
                '                path.forEach(p => { const cell = document.querySelector(`.cell[data-x="${p.x}"][data-y="${p.y}"]`); cell.classList.add("found"); });',
                '                renderWordList(); checkWin();',

                '        function flashError(path) {',
                '            path.forEach(p => { const cell = document.querySelector(`.cell[data-x="${p.x}"][data-y="${p.y}"]`); if(cell) cell.classList.add("error"); });',

            ];
            
            return htmlParts.join('\n');
        };

        function WordSearchGenerator() {
            const [mode, setMode] = useState('setup');
            const [config, setConfig] = useState({
                title: '中文词汇大挑战',
                words: DEFAULT_WORDS,
                difficulty: 'easy',
                theme: 'kids',
                wordsPerGame: 0 // 0 means ALL
            });
            const [batchInput, setBatchInput] = useState("");

            const [grid, setGrid] = useState([]);
            const [activeWords, setActiveWords] = useState([]);
            const [foundWords, setFoundWords] = useState([]);
            const [timeElapsed, setTimeElapsed] = useState(0);
            const [timerActive, setTimerActive] = useState(false);
            const [selectionStart, setSelectionStart] = useState(null);
            const [errorPath, setErrorPath] = useState([]);

            const handleChineseBlur = async (index, value) => {
                if (!value.trim()) return;
                
                const newWords = [...config.words];
                const currentWord = newWords[index];
                
                // 每次修改都尝试重新生成拼音
                try {
                    const { pinyin } = pinyinPro;
                    const pinyinResult = pinyin(value);
                    newWords[index].pinyin = pinyinResult;
                } catch (e) {
                    console.error("Pinyin generation failed", e);
                }

                // 每次修改都尝试重新生成英文翻译
                newWords[index].loading = true;
                setConfig({ ...config, words: newWords }); 

                try {
                    // 使用免费的 MyMemory 翻译 API
                    const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(value)}&langpair=zh|en`);
                    const data = await res.json();
                    
                    if (data && data.responseData && data.responseData.translatedText) {
                        const updatedWords = [...newWords]; 
                        updatedWords[index].english = data.responseData.translatedText;
                        updatedWords[index].loading = false;
                        setConfig(prev => ({ ...prev, words: updatedWords }));
                    } else {
                            const updatedWords = [...newWords];
                            updatedWords[index].loading = false;
                            setConfig(prev => ({ ...prev, words: updatedWords }));
                    }
                } catch (e) {
                    console.error("Translation failed", e);
                    const updatedWords = [...newWords];
                    updatedWords[index].loading = false;
                    setConfig(prev => ({ ...prev, words: updatedWords }));
                }
            };

            const handleBatchAdd = async () => {
                if (!batchInput.trim()) return;
                
                const rawWords = batchInput.split(/[,\s，\n]+/).filter(w => w.trim());
                if (rawWords.length === 0) return;

                const newWords = rawWords.map(word => ({
                    id: Date.now() + Math.random().toString(),
                    chinese: word,
                    pinyin: '',
                    english: '',
                    loading: true
                }));

                setConfig(prev => ({
                    ...prev,
                    words: [...prev.words, ...newWords]
                }));
                setBatchInput(""); 

                const { pinyin } = pinyinPro;
                
                const processedWords = await Promise.all(newWords.map(async (item) => {
                    let p = item.pinyin;
                    let e = item.english;
                    
                    try { p = pinyin(item.chinese); } catch (err) { console.error(err); }

                    try {
                        const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(item.chinese)}&langpair=zh|en`);
                        const data = await res.json();
                        if (data && data.responseData) e = data.responseData.translatedText;
                    } catch (err) { console.error(err); }

                    return { ...item, pinyin: p, english: e, loading: false };
                }));

                setConfig(prev => {
                    const currentWords = [...prev.words];
                    const updatedWords = currentWords.map(w => {
                        const processed = processedWords.find(pw => pw.id === w.id);
                        return processed ? processed : w;
                    });
                    return { ...prev, words: updatedWords };
                });
            };

            const handleClearAll = () => {
                if (window.confirm("确定要清空所有词汇吗？")) {
                    setConfig(prev => ({ ...prev, words: [] }));
                }
            };

            // React 内的生成逻辑也需要支持 subset
            const generateGame = () => {
                // 1. 随机选择子集
                const wordsPerGame = config.wordsPerGame > 0 ? config.wordsPerGame : config.words.length;
                const shuffled = [...config.words].sort(() => 0.5 - Math.random());
                const currentActiveWords = shuffled.slice(0, Math.min(wordsPerGame, config.words.length));
                
                setActiveWords(currentActiveWords);

                // 2. 根据选中的词计算网格
                const maxLen = currentActiveWords.reduce((max, w) => Math.max(max, w.chinese.length), 0);
                const size = calculateGridSize(config.difficulty, currentActiveWords.length, maxLen);
                
                let newGrid = Array(size).fill(null).map((_, y) => Array(size).fill(null).map((_, x) => ({ char: '', x, y, isTarget: false, found: false })));
                const sortedWords = [...currentActiveWords].sort((a, b) => b.chinese.length - a.chinese.length);

                for (const word of sortedWords) {
                    let placed = false;
                    let attempts = 0;
                    while (!placed && attempts < 100) {
                        const direction = Math.random() > 0.5 ? 'H' : 'V';
                        const row = Math.floor(Math.random() * size);
                        const col = Math.floor(Math.random() * size);
                        if (direction === 'H' && col + word.chinese.length > size) { attempts++; continue; }
                        if (direction === 'V' && row + word.chinese.length > size) { attempts++; continue; }
                        let collision = false;
                        for (let i = 0; i < word.chinese.length; i++) {
                            const r = direction === 'V' ? row + i : row;
                            const c = direction === 'H' ? col + i : col;
                            if (newGrid[r][c].char !== '' && newGrid[r][c].char !== word.chinese[i]) { collision = true; break; }
                        }
                        if (!collision) {
                            for (let i = 0; i < word.chinese.length; i++) {
                                const r = direction === 'V' ? row + i : row;
                                const c = direction === 'H' ? col + i : col;
                                newGrid[r][c] = { ...newGrid[r][c], char: word.chinese[i], isTarget: true, targetId: word.id };
                            }
                            placed = true;
                        }
                        attempts++;
                    }
                }
                for (let y = 0; y < size; y++) {
                    for (let x = 0; x < size; x++) {
                        if (newGrid[y][x].char === '') { newGrid[y][x].char = COMMON_CHARS[Math.floor(Math.random() * COMMON_CHARS.length)]; }
                    }
                }
                setGrid(newGrid);
                setFoundWords([]);
                setTimeElapsed(0);
                setTimerActive(false);
                setSelectionStart(null);
                setErrorPath([]);
            };

            useEffect(() => {
                let interval;
                if (timerActive) { interval = setInterval(() => { setTimeElapsed(prev => prev + 1); }, 1000); }
                return () => clearInterval(interval);
            }, [timerActive]);

            useEffect(() => {
                if (mode === 'playing' && foundWords.length > 0 && foundWords.length === activeWords.length) {
                    setTimerActive(false);
                    setTimeout(() => setMode('result'), 1000);
                }
            }, [foundWords, mode, activeWords.length]);

            const handleCellClick = (x, y) => {
                if (mode !== 'playing') return;
                if (!selectionStart) { setSelectionStart({ x, y }); return; }
                const start = selectionStart; const end = { x, y };
                
                // --- 修改: 允许单字词选择 ---
                if (start.x === end.x && start.y === end.y) {
                    const char = grid[y][x].char;
                    // 检查这个单字是否是未找到的目标词
                    const matchedWord = activeWords.find(w => !foundWords.includes(w.id) && w.chinese === char);
                    
                    if (matchedWord) {
                        // 如果是有效单词，执行验证逻辑
                        validateSelection(start, end);
                        // 关键修正：成功找到单字后，必须清除 selectionStart，防止影响下一次点击
                        setSelectionStart(null);
                    } else {
                        // 如果不是单词，视为取消选择（静默取消，不报错）
                        setSelectionStart(null);
                    }
                    return;
                }
                // --- 修改结束 ---

                validateSelection(start, end);
                setSelectionStart(null);
            };

            const validateSelection = (start, end) => {
                const dx = Math.sign(end.x - start.x); const dy = Math.sign(end.y - start.y);
                const isHorizontal = start.y === end.y; const isVertical = start.x === end.x; const isDiagonal = Math.abs(end.x - start.x) === Math.abs(end.y - start.y);
                const path = [];
                if (!isHorizontal && !isVertical && !isDiagonal) { triggerErrorAnimation([end]); return; }
                let currX = start.x; let currY = start.y;
                while (true) {
                    path.push({ x: currX, y: currY });
                    if (currX === end.x && currY === end.y) break;
                    currX += dx; currY += dy;
                }
                const selectedWordString = path.map(p => grid[p.y][p.x].char).join('');
                const matchedWord = activeWords.find(w => !foundWords.includes(w.id) && (w.chinese === selectedWordString));
                if (matchedWord) {
                    setFoundWords(prev => [...prev, matchedWord.id]);
                    const newGrid = [...grid];
                    path.forEach(pos => { newGrid[pos.y][pos.x].found = true; });
                    setGrid(newGrid);
                } else { triggerErrorAnimation(path); }
            };

            const triggerErrorAnimation = (path) => {
                setErrorPath(path);
                setTimeout(() => { setErrorPath([]); }, 1000);
            };

            const handleDownload = () => {
                const htmlContent = generateStandaloneHTML(config);
                const blob = new Blob([htmlContent], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${config.title}_游戏.html`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

            const themeStyles = useMemo(() => {
                if (config.theme === 'kids') {
                    return {

                    };
                } else {
                    return {
                        bg: 'bg-gray-100', wrapper: 'font-sans', container: 'bg-white/80 backdrop-blur-md border border-gray-200 rounded-2xl shadow-xl', headerText: 'text-gray-900 font-semibold tracking-tight', btnPrimary: 'bg-black hover:bg-gray-800 text-white font-medium rounded-lg transition-all shadow-sm active:scale-95', btnSecondary: 'bg-gray-200 hover:bg-gray-300 text-gray-900 font-medium rounded-lg transition-all active:scale-95', gridCell: 'border border-gray-100 text-gray-700 font-medium rounded-md hover:bg-gray-50', gridCellSelected: 'bg-blue-600 text-white border-blue-700 shadow-md', gridCellError: 'bg-red-500 text-white border-red-600', gridCellFound: 'bg-green-600 text-white border-green-700', clueBox: 'bg-gray-50 rounded-lg p-3 border border-gray-100', clueTextFound: 'text-gray-400 line-through',
                    };
                }
            }, [config.theme]);

            const formatTime = (s) => { const m = Math.floor(s / 60); const sec = s % 60; return `${m}:${sec < 10 ? '0' : ''}${sec}`; };

            return (
                <div className={`min-h-screen w-full p-6 ${themeStyles.bg} ${themeStyles.wrapper} flex flex-col`}>
                    <div className="w-full flex justify-center mb-6">
                        <div className="inline-flex items-center gap-2 px-4 py-2 bg-white/50 backdrop-blur-sm rounded-full border border-white/60 shadow-sm">
                            <span className="text-xl">🐼</span>
                            <span className="font-bold text-gray-700 tracking-wide">Chinese with Dora</span>
                        </div>
                    </div>
                    
                    {mode === 'setup' && (
                        <div className="max-w-4xl mx-auto flex-1 w-full flex flex-col items-center">
                            
                            {/* 1. Brand & Logo Section */}
                            <div className="text-center mb-8 animate-fade-in-up">
                                <h1 className="text-4xl md:text-5xl font-black text-gray-800 mb-2 tracking-tight">
                                    中文找字游戏
                                </h1>
                                <div className="text-xl text-gray-400 font-rounded">Word Search Generator</div>
                            </div>

                            <div className="bg-blue-50 border border-blue-200 text-blue-800 px-4 py-3 rounded-xl mb-6 flex items-start gap-3 shadow-sm w-full">
                                <Icons.Info className="flex-shrink-0 mt-0.5 text-blue-500" size={20} />
                                <div>
                                    <p className="font-bold text-sm mb-1">如何使用此独立版生成器：</p>
                                    <ol className="list-decimal list-inside text-sm space-y-1 text-blue-700">
                                        <li>在下方输入游戏标题、添加词汇并选择主题/难度。</li>
                                        <li>输入中文后，系统会尝试<strong>自动生成拼音和英文</strong>（英文翻译需联网）。</li>
                                        <li>点击右下角的 <strong>绿色「下载独立游戏文件 (HTML)」按钮</strong>。</li>
                                        <li>将下载的 <code>.html</code> 文件发送给学生即可直接使用。</li>
                                    </ol>
                                </div>
                            </div>
                            <div className="bg-white rounded-2xl shadow-xl border border-gray-100 p-6 md:p-8 w-full">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                    <div className="space-y-6">
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-600 mb-2">游戏标题</label>
                                            <input type="text" value={config.title} onChange={e => setConfig({ ...config, title: e.target.value })} className="w-full border rounded-lg p-3 focus:ring-2 focus:ring-blue-500 outline-none" />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-600 mb-2">风格主题</label>
                                            <div className="grid grid-cols-2 gap-4">
                                                <button onClick={() => setConfig({ ...config, theme: 'kids' })} className={`p-4 rounded-xl border-2 flex flex-col items-center gap-2 transition-all ${config.theme === 'kids' ? 'border-pink-400 bg-pink-50 text-pink-700' : 'border-gray-200 hover:border-gray-300'}`}><Icons.Star size={24} /><span>儿童可爱</span></button>
                                                <button onClick={() => setConfig({ ...config, theme: 'adult' })} className={`p-4 rounded-xl border-2 flex flex-col items-center gap-2 transition-all ${config.theme === 'adult' ? 'border-gray-800 bg-gray-50 text-gray-900' : 'border-gray-200 hover:border-gray-300'}`}><Icons.Grid3X3 size={24} /><span>简约设计</span></button>
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-600 mb-2">难度设置</label>
                                            <select value={config.difficulty} onChange={(e) => setConfig({ ...config, difficulty: e.target.value })} className="w-full border rounded-lg p-3 bg-white mb-2">
                                                {Object.entries(DIFFICULTY_SETTINGS).map(([key, val]) => (<option key={key} value={key}>{val.label}</option>))}
                                            </select>
                                            
                                            <label className="block text-sm font-semibold text-gray-600 mb-2 flex justify-between">
                                                <span>每次游戏词汇量</span>
                                                <span className="text-xs font-normal text-gray-400">默认为全部 ({config.words.length})</span>
                                            </label>
                                            <div className="flex items-center gap-2">
                                                <Icons.Shuffle size={16} className="text-gray-400" />
                                                <input 
                                                    type="number" 
                                                    min="1" 
                                                    max={config.words.length}
                                                    placeholder={`全部 (${config.words.length})`}
                                                    value={config.wordsPerGame === 0 ? '' : config.wordsPerGame} 
                                                    onChange={(e) => {
                                                        const val = parseInt(e.target.value);
                                                        setConfig({ ...config, wordsPerGame: isNaN(val) ? 0 : val });
                                                    }} 
                                                    className="w-full border rounded-lg p-3 bg-white" 
                                                />
                                            </div>
                                            <p className="text-xs text-gray-400 mt-2">
                                                * 若设置数量小于总词数，每次游戏将随机抽取不同词汇。
                                            </p>
                                        </div>
                                    </div>
                                    <div className="space-y-4">
                                        {/* 批量输入移动到这里，位于目标考察词汇上方 */}
                                        <div className="bg-gray-50 p-4 rounded-xl border border-gray-200">
                                            <label className="block text-sm font-bold text-gray-700 mb-2 flex items-center gap-2">
                                                <Icons.Wand2 size={16} className="text-purple-500" />
                                                批量输入 (自动生成拼音&翻译)
                                            </label>
                                            <textarea 
                                                className="w-full border rounded-lg p-3 text-sm h-24 focus:ring-2 focus:ring-purple-200 outline-none mb-2"
                                                placeholder="在此输入中文词汇，用空格、逗号或换行分隔。例如：熊猫 苹果 学校"
                                                value={batchInput}
                                                onChange={(e) => setBatchInput(e.target.value)}
                                            ></textarea>
                                            <button 
                                                onClick={handleBatchAdd}
                                                disabled={!batchInput.trim()}
                                                className="w-full bg-purple-600 hover:bg-purple-700 disabled:bg-purple-300 text-white py-2 rounded-lg text-sm font-bold flex items-center justify-center gap-2 transition-all active:scale-95"
                                            >
                                                <Icons.ListPlus size={16} /> 一键添加 & 生成
                                            </button>
                                        </div>

                                        <div className="flex justify-between items-center">
                                            <label className="block text-sm font-semibold text-gray-600">目标考察词汇 ({config.words.length})</label>
                                            <div className="flex gap-2">
                                                <button onClick={handleClearAll} className="text-xs bg-red-50 text-red-600 px-3 py-1 rounded-full hover:bg-red-100 font-medium flex items-center gap-1">
                                                    <Icons.Trash2 size={12} /> 清空
                                                </button>
                                                <button onClick={() => setConfig({ ...config, words: [...config.words, { id: Date.now().toString(), chinese: '', pinyin: '', english: '', loading: false }] })} className="text-xs bg-blue-50 text-blue-600 px-3 py-1 rounded-full hover:bg-blue-100 font-medium">
                                                    + 单个添加
                                                </button>
                                            </div>
                                        </div>
                                        <div className="h-[400px] overflow-y-auto space-y-3 pr-2 custom-scrollbar">
                                            {config.words.length === 0 && (
                                                <div className="text-center py-10 text-gray-400 text-sm border-2 border-dashed border-gray-200 rounded-lg">
                                                    暂无词汇，请使用上方批量输入或点击添加按钮
                                                </div>
                                            )}
                                            {config.words.map((word, idx) => (
                                                <div key={word.id} className="bg-gray-50 p-3 rounded-lg border border-gray-200 relative group transition-all hover:shadow-md">
                                                    <div className="grid grid-cols-3 gap-2 mb-2">
                                                        <div className="col-span-1">
                                                            <input 
                                                                placeholder="中文"
                                                                value={word.chinese}
                                                                onChange={e => { const newWords = [...config.words]; newWords[idx].chinese = e.target.value; setConfig({ ...config, words: newWords }); }}
                                                                onBlur={(e) => handleChineseBlur(idx, e.target.value)}
                                                                className="border rounded p-1 text-sm w-full font-bold text-gray-800" 
                                                            />
                                                        </div>
                                                        <div className="col-span-2 relative">
                                                            <input 
                                                                placeholder="拼音"
                                                                value={word.pinyin}
                                                                onChange={e => { const newWords = [...config.words]; newWords[idx].pinyin = e.target.value; setConfig({ ...config, words: newWords }); }}
                                                                className="border rounded p-1 text-sm w-full bg-white text-gray-600" 
                                                            />
                                                        </div>
                                                    </div>
                                                    <div className="grid grid-cols-1 relative">
                                                        <input 
                                                            placeholder="英文意思"
                                                            value={word.english}
                                                            onChange={e => { const newWords = [...config.words]; newWords[idx].english = e.target.value; setConfig({ ...config, words: newWords }); }}
                                                            className="border rounded p-1 text-sm w-full bg-white text-gray-600" 
                                                        />
                                                        {word.loading && (
                                                            <div className="absolute right-2 top-1.5 text-gray-400 bg-white pl-2">
                                                                <Icons.Loader size={14} className="animate-spin text-purple-500" />
                                                            </div>
                                                        )}
                                                    </div>
                                                    <button onClick={() => { const newWords = config.words.filter(w => w.id !== word.id); setConfig({ ...config, words: newWords }); }} className="absolute -top-2 -right-2 bg-red-100 text-red-500 rounded-full p-1 opacity-0 group-hover:opacity-100 transition-opacity hover:bg-red-200"><Icons.XCircle className="w-5 h-5" /></button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                                <div className="mt-8 flex justify-end gap-4">
                                    <button onClick={handleDownload} className="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-xl font-bold shadow-lg flex items-center gap-2 transition-transform active:scale-95"><Icons.Download size={20} /> 下载独立游戏文件 (HTML)</button>
                                    <button onClick={() => { if (config.words.some(w => !w.chinese)) { alert("请填写所有词汇的中文内容"); return; } generateGame(); setMode('landing'); }} className="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-xl font-bold shadow-lg shadow-blue-200 transition-transform active:scale-95 flex items-center gap-2">在线预览游戏 <Icons.ArrowLeft className="rotate-180" size={20} /></button>
                                </div>
                            </div>
                        </div>
                    )}

                    {mode === 'landing' && (
                        <div className={`min-h-screen w-full flex items-center justify-center p-4`}>
                            <div className={`max-w-md w-full p-10 text-center ${themeStyles.container} animate-fade-in-up`}>
                                {config.theme === 'kids' && (<div className="w-28 h-28 bg-sky-100 rounded-full mx-auto flex items-center justify-center mb-6 border-4 border-sky-300 shadow-md animate-bounce-slow"><span className="text-5xl">🐼</span></div>)}
                                {config.theme === 'adult' && (<div className="w-16 h-16 bg-black text-white rounded-xl mx-auto flex items-center justify-center mb-6 shadow-lg"><Icons.Type size={32} /></div>)}
                                <h1 className={`text-4xl mb-3 ${themeStyles.headerText}`}>{config.title}</h1>
                                <div className="inline-block px-4 py-1 rounded-full bg-gray-100 text-gray-500 text-sm font-semibold mb-8">难度: {DIFFICULTY_SETTINGS[config.difficulty].label}</div>
                                <button onClick={() => { generateGame(); setMode('playing'); setTimerActive(true); }} className={`w-full py-4 text-xl flex items-center justify-center gap-3 ${themeStyles.btnPrimary}`}><Icons.Play fill="currentColor" size={24} /> 开始游戏</button>
                                <button onClick={() => setMode('setup')} className="mt-4 text-gray-400 text-sm hover:text-gray-600 underline">返回老师设置</button>
                            </div>
                        </div>
                    )}

                    {mode === 'playing' && (
                        <div className={`min-h-screen w-full flex flex-col items-center justify-center p-4 md:p-8`}>
                            <div className="w-full max-w-5xl flex justify-between items-center mb-6">
                                <h2 className={`text-2xl md:text-3xl ${themeStyles.headerText}`}>{config.title}</h2>
                                <div className={`flex items-center gap-2 px-4 py-2 rounded-full ${config.theme === 'kids' ? 'bg-white shadow-sm border-2 border-orange-100' : 'bg-white shadow-sm border border-gray-200'}`}>
                                    <Icons.Clock size={20} className={config.theme === 'kids' ? "text-orange-400" : "text-gray-500"} />
                                    <span className="font-mono text-xl font-bold text-gray-700">{formatTime(timeElapsed)}</span>
                                </div>
                            </div>
                            <div className="w-full max-w-6xl flex flex-col md:flex-row gap-8 items-start justify-center">
                                <div className={`relative p-4 md:p-6 select-none ${themeStyles.container}`}>
                                    <div className="grid gap-1 md:gap-2" style={{ gridTemplateColumns: `repeat(${calculateGridSize(config.difficulty, activeWords.length, activeWords.reduce((max, w) => Math.max(max, w.chinese.length), 0))}, minmax(0, 1fr))` }}>
                                        {grid.map((row, y) => row.map((cell, x) => {
                                            const isStart = selectionStart?.x === x && selectionStart?.y === y;
                                            const isError = errorPath.some(p => p.x === x && p.y === y);
                                            return (
                                                <div key={`${x}-${y}`} className={`w-8 h-8 md:w-10 md:h-10 lg:w-12 lg:h-12 flex items-center justify-center text-lg md:text-xl lg:text-2xl cursor-pointer transition-all duration-200 ${themeStyles.gridCell} ${isStart ? themeStyles.gridCellSelected : ''} ${cell.found ? themeStyles.gridCellFound : ''} ${isError ? themeStyles.gridCellError : ''}`} onClick={() => handleCellClick(x, y)} style={calculateGridSize(config.difficulty, activeWords.length, activeWords.reduce((max, w) => Math.max(max, w.chinese.length), 0)) > 12 ? { fontSize: '1rem' } : {}}>{cell.char}</div>
                                            );
                                        }))}
                                    </div>
                                </div>
                                <div className="w-full md:w-80 flex flex-col gap-4">
                                    <div className={`p-5 w-full ${themeStyles.container}`}>
                                        <h3 className={`text-lg font-bold mb-4 flex items-center gap-2 ${config.theme === 'kids' ? 'text-pink-500' : 'text-gray-800'}`}>{config.theme === 'kids' ? <Icons.Star className="fill-current" /> : <Icons.CheckCircle />} 任务列表 ({foundWords.length}/{activeWords.length})</h3>
                                        <div className="grid grid-cols-2 md:grid-cols-1 gap-3">
                                            {activeWords.map(word => {
                                                const isFound = foundWords.includes(word.id);
                                                return (
                                                    <div key={word.id} className={`transition-all duration-500 ${themeStyles.clueBox} ${isFound ? themeStyles.clueTextFound : ''}`}>
                                                        <div className="flex justify-between items-start"><div className="flex-1"><div className="text-lg font-bold font-mono">{word.pinyin}</div></div>{isFound && <Icons.CheckCircle size={18} className="text-green-500 mt-1" />}</div>
                                                        <div className="text-sm mt-1 opacity-80 border-t border-dashed border-gray-200 pt-1 mt-2">{word.english}</div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                    <button onClick={() => { const confirm = window.confirm("确定要重新开始吗？当前进度将丢失。"); if (confirm) generateGame(); }} className={`w-full py-3 flex items-center justify-center gap-2 ${themeStyles.btnSecondary}`}><Icons.RefreshCw size={18} /> 重置游戏</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {mode === 'result' && (
                        <div className={`min-h-screen w-full flex items-center justify-center p-4`}>
                            <div className={`max-w-md w-full p-10 text-center relative overflow-hidden ${themeStyles.container} animate-bounce-in`}>
                                <div className="mb-6 flex justify-center">{config.theme === 'kids' ? (<div className="bg-yellow-100 p-6 rounded-full animate-bounce"><Icons.Trophy size={64} className="text-yellow-500 fill-yellow-500" /></div>) : (<Icons.CheckCircle size={80} className="text-black" />)}</div>
                                <h2 className={`text-3xl font-bold mb-2 ${themeStyles.headerText}`}>{config.theme === 'kids' ? "太棒了！完成任务！" : "任务完成"}</h2>
                                <p className="text-gray-500 mb-8">你找到了所有单词！</p>
                                <div className={`bg-gray-50 rounded-xl p-6 mb-8 ${config.theme === 'kids' ? 'border-2 border-dashed border-yellow-200' : 'border border-gray-100'}`}>
                                    <div className="text-sm text-gray-400 uppercase tracking-wider font-semibold mb-1">最终用时</div>
                                    <div className={`text-4xl font-mono font-bold ${config.theme === 'kids' ? 'text-pink-500' : 'text-gray-900'}`}>{formatTime(timeElapsed)}</div>
                                </div>
                                <div className="space-y-3">
                                    <button onClick={() => { generateGame(); setMode('playing'); setTimerActive(true); }} className={`w-full py-4 text-lg ${themeStyles.btnPrimary}`}>再玩一次</button>
                                    <button onClick={() => setMode('landing')} className={`w-full py-3 ${themeStyles.btnSecondary}`}>返回首页</button>
                                </div>
                            </div>
                        </div>
                    )}
                    <div className="w-full text-center py-4 text-gray-400 text-xs font-sans mt-auto">Designed by Chinese with Dora</div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<WordSearchGenerator />);
    </script>
</body>
</html>
