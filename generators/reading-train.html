<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互动游戏生成工具 - Chinese with Dora</title>
<style id="kd-kids-theme">
/* 儿童类生成器统一风格 - 由中文游戏工坊注入（外壳统一：圆润中文字体 + 标题品牌色；玩法区与对错配色不动） */
:root{
  --kd-primary:#FF7A45;
  --kd-primary-d:#E85C2A;
}
body{
  font-family:'Varela Round','Noto Sans TC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif !important;
}
h1,.title,.brand-title,.app-title,header h1,.header-title,.app-header h1{
  color:var(--kd-primary-d) !important;
}
</style>

    <!-- 引入 pinyin-pro 库用于自动生成拼音 -->
    <script src="https://unpkg.com/pinyin-pro"></script>
    <style>
        :root {
            --primary: #4A90E2;
            --bg: #F5F7FA;
            --text: #333;
            --highlight: #FFD166;
            --success: #4caf50;
        }
        body {
            font-family: 'Helvetica Neue', Arial, 'Microsoft YaHei', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 900px; margin: 0 auto; background: white;
            padding: 40px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h1 { text-align: center; color: var(--primary); margin-bottom: 10px; }
        .subtitle { text-align: center; color: #888; margin-bottom: 40px; }
        
        .step-section {
            border: 2px solid #eef2f7; border-radius: 12px; padding: 25px; margin-bottom: 30px;
            transition: 0.3s;
        }
        .step-title { font-size: 20px; font-weight: bold; color: var(--primary); margin-top: 0; border-bottom: 2px solid #eef2f7; padding-bottom: 10px; }
        
        /* 输入区样式 */
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-weight: bold; margin-bottom: 8px; }
        input[type="text"], textarea {
            width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px;
            font-size: 16px; box-sizing: border-box; transition: 0.3s;
            font-family: inherit;
        }
        input[type="text"]:focus, textarea:focus { border-color: var(--primary); outline: none; }
        textarea { height: 150px; resize: vertical; }
        
        /* 按钮样式 */
        .btn {
            display: inline-block; padding: 12px 30px; background: var(--primary); color: white;
            border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 6px rgba(74, 144, 226, 0.3); transition: 0.2s;
        }
        .btn:hover { background: #357ABD; transform: translateY(-2px); box-shadow: 0 6px 10px rgba(74, 144, 226, 0.4); }
        .btn-success { background: var(--success); box-shadow: 0 4px 6px rgba(76, 175, 80, 0.3); }
        .btn-success:hover { background: #388E3C; box-shadow: 0 6px 10px rgba(76, 175, 80, 0.4); }
        .btn-secondary { background: #9e9e9e; box-shadow: 0 4px 6px rgba(158, 158, 158, 0.3); }
        .btn-secondary:hover { background: #757575; box-shadow: 0 6px 10px rgba(158, 158, 158, 0.4); }

        /* 标注区样式 */
        .instruction-box { background: #fffde7; border-left: 5px solid #FFD166; padding: 15px; margin-bottom: 20px; border-radius: 4px; color: #555; }
        .chinese-text { font-family: '楷体', 'KaiTi', 'STKaiti', serif; }
        #interactive-board {
            font-size: 32px; letter-spacing: 4px; line-height: 2.8;
            padding: 30px; background: #fafafa; border-radius: 10px; border: 1px dashed #ccc;
            min-height: 200px;
            white-space: pre-wrap; /* 保留文本原本的段落换行 */
            word-wrap: break-word;
        }
        
        /* 交互式 Ruby 样式 */
        .char-ruby { ruby-align: center; cursor: pointer; user-select: none; transition: 0.2s; }
        .char-ruby:hover .char { color: var(--primary); }
        .char { padding: 2px 4px; border-radius: 4px; }
        .pinyin {
            font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 16px; color: #666;
            transform: translateY(-2px); visibility: hidden; /* 默认隐藏拼音 */
            outline: none; cursor: pointer; /* 将光标改为手指，提示可点击 */
        }
        
        /* 选中状态 */
        .char-ruby.selected .char { background-color: var(--highlight); font-weight: bold; color: var(--text); }
        .char-ruby.selected .pinyin { visibility: visible; } /* 选中时显示拼音 */
        
        #step2 { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>互动游戏生成工具</h1>
    <div class="subtitle">Designed by Chinese with Dora</div>

    <!-- 第一步：输入内容 -->
    <div id="step1" class="step-section">
        <h2 class="step-title">第一步：配置课文</h2>
        <div class="input-group">
            <label for="game-title">游戏标题（将作为生成的网页文件名）：</label>
            <input type="text" id="game-title" placeholder="例如：第四课 喜欢的天气" value="中文挑战游戏">
        </div>
        <div class="input-group">
            <label for="raw-textarea">课文内容（直接粘贴文本）：</label>
            <textarea id="raw-textarea" class="chinese-text" placeholder="在此粘贴课文..."></textarea>
        </div>
        <div style="text-align: center;">
            <button class="btn" onclick="goToStep2()">下一步：标注生词 ➡️</button>
        </div>
    </div>

    <!-- 第二步：交互标注 -->
    <div id="step2" class="step-section">
        <h2 class="step-title">第二步：点击标注生词</h2>
        <div class="instruction-box">
            <strong>操作指南：</strong><br>
            1. 🖱️ <b>点击汉字</b> 即可将其设为生词（变黄并出现拼音）。再次点击可取消。<br>
            2. 🔗 相邻的高亮汉字会自动组合成一个“词语”，在填空和描红游戏中按词语出现。<br>
            3. ✏️ <b>多音字纠错</b>：如果自动生成的拼音不准确，直接<b>点击上方的拼音</b>，在弹出的窗口中修改即可。
        </div>
        
        <div id="interactive-board" class="chinese-text">
            <!-- 动态生成的交互文本 -->
        </div>

        <div style="text-align: center; margin-top: 30px; gap: 15px; display: flex; justify-content: center;">
            <button class="btn btn-secondary" onclick="backToStep1()">⬅️ 返回修改课文</button>
            <button class="btn btn-success" onclick="generateAndDownload()">✅ 生成并下载游戏包</button>
        </div>
    </div>
</div>

<script>
    // 提取 pinyinPro
    const { pinyin } = pinyinPro;

    function goToStep2() {
        const text = document.getElementById('raw-textarea').value.trim();
        if (!text) {
            alert("请先输入课文内容！");
            return;
        }

        const board = document.getElementById('interactive-board');
        board.innerHTML = '';

        // 将文本逐字渲染为可点击的 ruby 元素 (使用 textContent 保护排版)
        for (let i = 0; i < text.length; i++) {
            let char = text[i];
            // 判断是否是中文字符
            if (/[\u4e00-\u9fa5]/.test(char)) {
                let ruby = document.createElement('ruby');
                ruby.className = 'char-ruby';
                ruby.onclick = function() { toggleChar(this); };

                let span = document.createElement('span');
                span.className = 'char';
                span.textContent = char;

                let rt = document.createElement('rt');
                rt.className = 'pinyin';
                rt.onclick = function(e) { 
                    e.stopPropagation(); 
                    if (ruby.classList.contains('selected')) {
                        let newPy = prompt('修改 "' + char + '" 的拼音：', rt.textContent);
                        if (newPy !== null) {
                            rt.textContent = newPy.trim() || ' ';
                        }
                    }
                };

                ruby.appendChild(span);
                ruby.appendChild(rt);
                board.appendChild(ruby);
            } else {
                // 标点符号、换行符或其他字符
                let span = document.createElement('span');
                span.textContent = char;
                board.appendChild(span);
            }
        }

        document.getElementById('step1').style.display = 'none';
        document.getElementById('step2').style.display = 'block';
    }

    function toggleChar(rubyElement) {
        rubyElement.classList.toggle('selected');
        let rt = rubyElement.querySelector('.pinyin');
        let char = rubyElement.querySelector('.char').textContent;
        
        if (rubyElement.classList.contains('selected')) {
            rt.textContent = pinyin(char);
        } else {
            rt.textContent = '';
        }
    }

    function backToStep1() {
        if(confirm("返回第一步会丢失当前的生词标注，确认返回吗？")) {
            document.getElementById('step2').style.display = 'none';
            document.getElementById('step1').style.display = 'block';
        }
    }

    function generateAndDownload() {
        const title = document.getElementById('game-title').value.trim() || "中文挑战游戏";
        
        let finalRawText = "";
        let inWord = false;
        let currentWord = "";
        let currentPinyin = [];
        
        const boardNodes = document.getElementById('interactive-board').childNodes;
        
        boardNodes.forEach(node => {
            if (node.nodeType !== Node.ELEMENT_NODE) return;

            if (node.classList.contains('char-ruby')) {
                let isSelected = node.classList.contains('selected');
                let char = node.querySelector('.char').textContent;
                
                if (isSelected) {
                    let py = node.querySelector('.pinyin').textContent.trim() || ' ';
                    if (!inWord) {
                        inWord = true;
                        currentWord = char;
                        currentPinyin = [py];
                    } else {
                        currentWord += char;
                        currentPinyin.push(py);
                    }
                } else {
                    if (inWord) {
                        finalRawText += `[${currentWord}|${currentPinyin.join(' ')}]`;
                        inWord = false;
                        currentWord = "";
                        currentPinyin = [];
                    }
                    finalRawText += char;
                }
            } else {
                // 标点符号或换行符
                if (inWord) {
                    finalRawText += `[${currentWord}|${currentPinyin.join(' ')}]`;
                    inWord = false;
                    currentWord = "";
                    currentPinyin = [];
                }
                finalRawText += node.textContent;
            }
        });
        
        // 处理结尾可能的残留
        if (inWord) {
            finalRawText += `[${currentWord}|${currentPinyin.join(' ')}]`;
        }

        // 2. 将数据注入到学生游戏模板中
        let templateStr = getStudentTemplate();
        templateStr = templateStr.replace(/___GAME_TITLE___/g, title);
        
        // 【核心修复】使用 JSON.stringify 编码 finalRawText，完美规避多行文本、换行、引号等导致的 JS 语法错误！
        templateStr = templateStr.replace(/"___RAW_TEXT___"/g, () => JSON.stringify(finalRawText));

        // 3. 触发本地下载
        let blob = new Blob([templateStr], { type: 'text/html;charset=utf-8' });
        let url = URL.createObjectURL(blob);
        let a = document.createElement('a');
        a.href = url;
        a.download = `${title}.html`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    // 学生游戏包的完整代码模板 (使用 \x3C 转义闭合 script 标签以防止冲突)
    function getStudentTemplate() {
        return `<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>___GAME_TITLE___ - Chinese with Dora</title>
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js">\x3C/script>
    <style>
        :root { --primary: #4A90E2; --bg: #F5F7FA; --text: #333; --highlight: #FFD166; --success: #4caf50; }
        body { font-family: 'Helvetica Neue', Arial, 'Microsoft YaHei', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; line-height: 1.8; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: var(--primary); margin-bottom: 30px; }
        .tabs { display: flex; justify-content: center; margin-bottom: 30px; border-bottom: 2px solid #eee; flex-wrap: wrap; }
        .tab-btn { background: none; border: none; padding: 12px 25px; font-size: 18px; cursor: pointer; color: #888; border-bottom: 4px solid transparent; transition: 0.3s; font-weight: 500; }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: bold; }
        .tab-content { display: none; animation: fadeIn 0.4s; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .chinese-text { font-family: '楷体', 'KaiTi', 'STKaiti', serif; }
        .article-box { font-size: 32px; letter-spacing: 4px; line-height: 2.6; margin-bottom: 30px; padding: 20px; background: #fafafa; border-radius: 10px; white-space: pre-wrap; word-wrap: break-word; }
        ruby { ruby-align: center; }
        rt { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 16px; color: #666; transform: translateY(-2px); }
        .read-word { background-color: var(--highlight); font-weight: bold; padding: 2px 6px; border-radius: 8px; margin: 0 2px; }
        .audio-controls { display: flex; justify-content: center; gap: 15px; margin: 20px 0 30px 0; flex-wrap: wrap; }
        .play-btn, .pause-btn, .submit-btn { display: block; padding: 12px 25px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 18px; cursor: pointer; box-shadow: 0 4px 6px rgba(74, 144, 226, 0.3); transition: 0.2s; font-weight: bold; margin: 0; }
        .play-btn:hover, .pause-btn:hover, .submit-btn:hover { background: #357ABD; transform: translateY(-2px); box-shadow: 0 6px 10px rgba(74, 144, 226, 0.4); }
        .pause-btn { background: #FFA726; box-shadow: 0 4px 6px rgba(255, 167, 38, 0.3); }
        .pause-btn:hover { background: #FB8C00; box-shadow: 0 6px 10px rgba(255, 167, 38, 0.4); }
        .stop-btn { background: #e53935; box-shadow: 0 4px 6px rgba(229, 57, 53, 0.3); }
        .stop-btn:hover { background: #c62828; box-shadow: 0 6px 10px rgba(229, 57, 53, 0.4); }
        .submit-btn { margin: 20px auto; padding: 15px 40px; font-size: 20px; }
        .blank-space { display: inline-block; min-width: 45px; padding: 2px 6px; background-color: #e2e8f0; border-radius: 8px; margin: 0 6px; text-align: center; cursor: pointer; color: var(--primary); font-weight: bold; }
        .blank-space:empty::before { content: '\\200b'; }
        .blank-space.error { background-color: #ffcdd2; color: #c62828; }
        .word-pool { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; padding: 25px; background: #f0f4f8; border-radius: 12px; border: 2px dashed #bbd0e8; }
        .pool-char { width: 60px; height: 60px; line-height: 60px; text-align: center; background: white; border: 2px solid var(--primary); border-radius: 10px; font-size: 38px; cursor: pointer; user-select: none; box-shadow: 0 3px 6px rgba(0,0,0,0.1); transition: 0.1s; }
        .pool-char:active { transform: scale(0.95); }
        .pool-char.hidden { visibility: hidden; }
        .tracing-workspace { display: flex; flex-direction: column; align-items: center; margin-top: 30px; padding: 30px; background: #fff; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); border: 1px solid #eee; }
        .trace-instruction { font-size: 22px; margin-bottom: 20px; color: #555; text-align: center; }
        .trace-target-preview { font-size: 48px; color: var(--primary); font-weight: bold; margin-bottom: 15px; }
        .writer-container { width: 250px; height: 250px; border: 2px dashed #999; background: #fff url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><line x1="0" y1="0" x2="100%" y2="100%" stroke="%23ffe0e0" stroke-width="2"/><line x1="100%" y1="0" x2="0" y2="100%" stroke="%23ffe0e0" stroke-width="2"/><line x1="50%" y1="0" x2="50%" y2="100%" stroke="%23ffe0e0" stroke-width="2"/><line x1="0" y1="50%" x2="100%" y2="50%" stroke="%23ffe0e0" stroke-width="2"/></svg>'); border-radius: 8px; margin-bottom: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .queue-container { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; padding: 15px; background: #f9f9f9; border-radius: 10px; width: 100%; }
        .queue-item { width: 45px; height: 45px; border: 2px solid #ddd; line-height: 45px; text-align: center; border-radius: 8px; color: #aaa; font-size: 16px; background: white; font-family: 'Helvetica Neue', Arial, sans-serif; transition: 0.3s; }
        .queue-item.active { border-color: var(--primary); color: var(--primary); font-weight: bold; box-shadow: 0 0 10px rgba(74, 144, 226, 0.3); transform: scale(1.1); }
        .queue-item.done { background: #e8f5e9; color: var(--success); border-color: var(--success); font-size: 24px; font-weight: bold; }
        .trace-completed-msg { font-size: 28px; color: var(--success); font-weight: bold; text-align: center; padding: 40px; line-height: 1.5; }
        .watermark { text-align: center; margin-top: 50px; color: #ccc; font-style: italic; font-size: 15px; }
        #message-box { display: none; text-align: center; padding: 15px; margin: 20px auto; border-radius: 8px; font-weight: bold; max-width: 450px; font-size: 18px; }
    </style>
</head>
<body>
<div class="container">
    <h1 id="title-text">___GAME_TITLE___</h1>
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(1)">1. 朗读与认字 (Read & Learn)</button>
        <button class="tab-btn" onclick="switchTab(2)">2. 拼音填空 (Pinyin Fill-in)</button>
        <button class="tab-btn" onclick="switchTab(3)">3. 画廊描红 (Character Tracing)</button>
    </div>
    <div id="tab1" class="tab-content active">
        <div class="audio-controls">
            <button class="play-btn" onclick="playAudio()">🔊 播放课文 (Play)</button>
            <button class="pause-btn" onclick="togglePauseAudio()" id="pause-btn-text">⏸ 暂停 (Pause)</button>
            <button class="play-btn stop-btn" onclick="stopAudio()">⏹ 停止 (Stop)</button>
        </div>
        <div id="article-read" class="article-box chinese-text"></div>
    </div>
    <div id="tab2" class="tab-content">
        <div id="article-fill" class="article-box chinese-text"></div>
        <div class="word-pool" id="word-pool"></div>
        <div id="message-box"></div>
        <button class="submit-btn" onclick="checkAnswers()">提交答案 (Submit)</button>
    </div>
    <div id="tab3" class="tab-content">
        <div id="article-trace" class="article-box chinese-text" style="font-size: 28px;"></div>
        <div id="tracing-workspace-container"></div>
    </div>
    <div class="watermark">Designed by Chinese with Dora</div>
</div>
<script>
    // 这行代码已被修复，现在它可以完美接受换行符和任何引号！
    const rawText = "___RAW_TEXT___";
    let parsedData = []; let targetChars = []; 
    function parseText() {
        const regex = /\\[(.*?)\\|(.*?)\\]/g; let lastIndex = 0; let match; let charIdCounter = 0;
        while ((match = regex.exec(rawText)) !== null) {
            if (match.index > lastIndex) parsedData.push({ type: 'text', content: rawText.substring(lastIndex, match.index) });
            let word = match[1]; let pinyins = match[2].split(' '); let wordChars = [];
            for (let i = 0; i < word.length; i++) {
                let charObj = { char: word[i], pinyin: pinyins[i] || '', id: 'char_' + charIdCounter++ };
                wordChars.push(charObj); targetChars.push(charObj);
            }
            parsedData.push({ type: 'word', chars: wordChars, fullWord: word }); lastIndex = regex.lastIndex;
        }
        if (lastIndex < rawText.length) parsedData.push({ type: 'text', content: rawText.substring(lastIndex) });
    }
    function init() {
        parseText(); renderTab1(); renderTab2(); renderTab3();
        if ('speechSynthesis' in window) window.speechSynthesis.onvoiceschanged = function() { window.speechSynthesis.getVoices(); };
    }
    function renderTab1() {
        let html = '';
        parsedData.forEach(item => {
            if (item.type === 'text') html += item.content;
            else html += \`<ruby class="read-word chinese-text">\${item.fullWord}<rt>\${item.chars.map(c=>c.pinyin).join(' ')}</rt></ruby>\`;
        });
        document.getElementById('article-read').innerHTML = html;
    }
    function playAudio() {
        if ('speechSynthesis' in window) {
            if (window.speechSynthesis.paused) { window.speechSynthesis.resume(); document.getElementById('pause-btn-text').textContent = "⏸ 暂停 (Pause)"; return; }
            let cleanText = rawText.replace(/\\[(.*?)\\|.*?\\]/g, "$1");
            let utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'zh-CN'; utterance.rate = 0.85; 
            utterance.onend = function() { document.getElementById('pause-btn-text').textContent = "⏸ 暂停 (Pause)"; };
            let voices = speechSynthesis.getVoices();
            if (voices.length > 0) {
                let mandarinVoice = voices.find(v => (v.lang === 'zh-CN' || v.lang === 'cmn-CN' || v.lang === 'zh-Hans-CN') && !v.name.toLowerCase().includes('hong kong') && !v.name.toLowerCase().includes('cantonese') && !v.name.toLowerCase().includes('hk')) || voices.find(v => v.lang.includes('zh'));
                if (mandarinVoice) utterance.voice = mandarinVoice;
            }
            speechSynthesis.cancel(); speechSynthesis.speak(utterance); document.getElementById('pause-btn-text').textContent = "⏸ 暂停 (Pause)";
        } else alert("抱歉，您的浏览器不支持语音朗读功能。(Sorry, your browser does not support text-to-speech.)");
    }
    function togglePauseAudio() {
        if ('speechSynthesis' in window && window.speechSynthesis.speaking) {
            if (window.speechSynthesis.paused) { window.speechSynthesis.resume(); document.getElementById('pause-btn-text').textContent = "⏸ 暂停 (Pause)"; } 
            else { window.speechSynthesis.pause(); document.getElementById('pause-btn-text').textContent = "▶ 继续 (Resume)"; }
        }
    }
    function stopAudio() { if ('speechSynthesis' in window) { window.speechSynthesis.cancel(); document.getElementById('pause-btn-text').textContent = "⏸ 暂停 (Pause)"; } }
    
    let poolChars = [];
    function renderTab2() {
        let html = '';
        parsedData.forEach(item => {
            if (item.type === 'text') html += item.content;
            else item.chars.forEach(c => { html += \`<ruby><span class="blank-space fill-blank chinese-text" data-id="\${c.id}" data-target="\${c.char}" onclick="returnChar(this)"></span><rt>\${c.pinyin}</rt></ruby>\`; });
        });
        document.getElementById('article-fill').innerHTML = html;
        poolChars = [...targetChars].sort(() => Math.random() - 0.5); let poolHtml = '';
        poolChars.forEach((c, index) => { poolHtml += \`<div class="pool-char chinese-text" id="pool_\${index}" onclick="selectChar('\${c.char}', 'pool_\${index}')">\${c.char}</div>\`; });
        document.getElementById('word-pool').innerHTML = poolHtml;
    }
    function selectChar(char, poolElementId) {
        let blanks = document.querySelectorAll('.fill-blank');
        for (let blank of blanks) {
            if (blank.textContent === '') { blank.textContent = char; blank.setAttribute('data-source', poolElementId); blank.classList.remove('error'); document.getElementById(poolElementId).classList.add('hidden'); break; }
        }
    }
    function returnChar(blankElement) {
        if (blankElement.textContent !== '') {
            let poolElementId = blankElement.getAttribute('data-source');
            if(poolElementId && document.getElementById(poolElementId)) document.getElementById(poolElementId).classList.remove('hidden');
            blankElement.textContent = ''; blankElement.removeAttribute('data-source'); blankElement.classList.remove('error'); blankElement.style.backgroundColor = '';
        }
    }
    function showMessage(msg, isError) {
        const msgBox = document.getElementById('message-box'); msgBox.innerHTML = msg; msgBox.style.display = 'block';
        msgBox.style.backgroundColor = isError ? '#ffebee' : '#e8f5e9'; msgBox.style.color = isError ? '#c62828' : '#2e7d32';
        setTimeout(() => { msgBox.style.display = 'none'; }, 3000);
    }
    function checkAnswers() {
        let blanks = document.querySelectorAll('.fill-blank'); let allCorrect = true; let isFull = true;
        blanks.forEach(blank => {
            if (blank.textContent === '') isFull = false;
            else if (blank.textContent !== blank.getAttribute('data-target')) { allCorrect = false; blank.classList.add('error'); setTimeout(() => returnChar(blank), 800); } 
            else { blank.style.color = 'var(--success)'; blank.style.backgroundColor = '#e8f5e9'; }
        });
        if (!isFull) showMessage("还有空没填完哦！<br><span style='font-size:14px;font-weight:normal;'>Please fill in all blanks!</span>", true); else if (allCorrect) showMessage("太棒了！全部正确！🎉<br><span style='font-size:14px;font-weight:normal;'>Great job! All correct!</span>", false);
    }
    
    let currentTraceIndex = 0; let activeWriter = null;
    function renderTab3() {
        let html = '';
        parsedData.forEach(item => {
            if (item.type === 'text') html += item.content;
            else item.chars.forEach(c => { html += \`<ruby><span class="blank-space trace-blank chinese-text" id="trace_blank_\${c.id}"></span><rt>\${c.pinyin}</rt></ruby>\`; });
        });
        document.getElementById('article-trace').innerHTML = html;
        currentTraceIndex = 0; updateTracingWorkspace();
    }
    function updateTracingWorkspace() {
        const container = document.getElementById('tracing-workspace-container');
        if (currentTraceIndex >= targetChars.length) { container.innerHTML = \`<div class="trace-completed-msg">🎉 太棒了！所有的字都写完啦！<br><span style="font-size: 20px; color: #666; font-weight:normal;">Awesome! You have finished tracing all characters!</span></div>\`; return; }
        let currentChar = targetChars[currentTraceIndex]; let queueHtml = '';
        targetChars.forEach((c, idx) => {
            let statusClass = ''; let displayContent = c.pinyin;
            if (idx < currentTraceIndex) { statusClass = 'done'; displayContent = '✓'; } 
            else if (idx === currentTraceIndex) statusClass = 'active';
            queueHtml += \`<div class="queue-item \${statusClass}">\${displayContent}</div>\`;
        });
        container.innerHTML = \`
            <div class="tracing-workspace">
                <div class="trace-instruction">第 \${currentTraceIndex + 1} / \${targetChars.length} 个字，请用鼠标在虚线框内书写：<br><span style="font-size: 16px; color: #888;">Character \${currentTraceIndex + 1} of \${targetChars.length}. Please trace inside the dashed box:</span></div>
                <div class="trace-target-preview"><ruby class="chinese-text">\${currentChar.char}<rt>\${currentChar.pinyin}</rt></ruby></div>
                <div id="active-writer" class="writer-container"></div>
                <div class="queue-container">\${queueHtml}</div>
            </div>\`;
        setTimeout(() => {
            document.getElementById('active-writer').innerHTML = ''; 
            activeWriter = HanziWriter.create('active-writer', currentChar.char, { width: 250, height: 250, padding: 15, showOutline: true, strokeAnimationSpeed: 1.5, delayBetweenStrokes: 50, showHintAfterMisses: 1, highlightColor: '#4A90E2', drawingWidth: 15 });
            activeWriter.quiz({
                onComplete: function() {
                    let blankEl = document.getElementById('trace_blank_' + currentChar.id);
                    blankEl.textContent = currentChar.char; blankEl.style.color = 'var(--success)'; blankEl.style.backgroundColor = '#e8f5e9';
                    setTimeout(() => { currentTraceIndex++; updateTracingWorkspace(); }, 800);
                }
            });
        }, 100);
    }
    function switchTab(tabIndex) {
        document.querySelectorAll('.tab-btn').forEach((btn, index) => { if (index + 1 === tabIndex) btn.classList.add('active'); else btn.classList.remove('active'); });
        document.querySelectorAll('.tab-content').forEach((content, index) => { if (index + 1 === tabIndex) content.classList.add('active'); else content.classList.remove('active'); });
        if(tabIndex === 3 && activeWriter === null) updateTracingWorkspace();
    }
    window.onload = init;
\x3C/script>
</body>
</html>`;
    }
</script>
