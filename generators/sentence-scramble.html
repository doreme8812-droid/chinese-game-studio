<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <title>语块重组游戏生成器 - Chinese Sentence Scramble Generator</title>
<style id="kd-kids-theme">
/* 儿童类生成器统一风格 - 由中文游戏工坊注入（外壳统一：圆润中文字体 + 标题品牌色；玩法区与对错配色不动） */
:root{
  --kd-primary:#FF7A45;
  --kd-primary-d:#E85C2A;
}
body{
  font-family:'Varela Round','Noto Sans TC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif !important;
}

  color:var(--kd-primary-d) !important;
}
</style>

    
    <!-- 核心依赖 -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Varela Round', 'Noto Sans SC', "Segoe UI", sans-serif; background-color: #f8fafc; }
        
        /* 自定义滚动条 */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* 动画关键帧 */
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob { animation: blob 7s infinite; }
        .animation-delay-2000 { animation-delay: 2s; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- 图标组件 ---
        const Icons = {
            Settings: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.39a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>,
            Download: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>,
            Trash2: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>,
            Plus: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>,
            Wand2: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72Z"/><path d="m14 7 3 3"/><path d="M5 6v4"/><path d="M19 14v4"/><path d="M10 2v2"/><path d="M7 8H3"/><path d="M21 16h-4"/><path d="M11 3H9"/></svg>,
            Info: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>,
            Grip: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="9" r="1"/><circle cx="19" cy="9" r="1"/><circle cx="5" cy="9" r="1"/><circle cx="12" cy="15" r="1"/><circle cx="19" cy="15" r="1"/><circle cx="5" cy="15" r="1"/></svg>,
            Volume2: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        };

        // --- 默认数据 ---
        const DEFAULT_QUESTIONS = [
            { id: '1', question: '你叫什么名字？', questionEn: 'What is your name?', questionPinyin: 'nǐ jiào shén me míng zì ？', answer: '我 叫 大卫', chunks: ['我', '叫', '大卫'], distractors: '他 名字' },
            { id: '2', question: '你好吗？', questionEn: 'How are you?', questionPinyin: 'nǐ hǎo ma ？', answer: '我 很 好', chunks: ['我', '很', '好'], distractors: '不 是' },
            { id: '3', question: '你几岁？', questionEn: 'How old are you?', questionPinyin: 'nǐ jǐ suì ？', answer: '我八岁', chunks: ['我八岁'], distractors: '十 你' },
        ];

        // --- 核心逻辑：生成独立 HTML 游戏文件 ---
        const generateStandaloneHTML = (config) => {
            const configJson = JSON.stringify(config).replace(/</g, '\\u003c');
            
            return `<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${config.title}</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"><\/script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"><\/script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"><\/script>
    <script src="https://cdn.tailwindcss.com"><\/script>
    <script src="https://unpkg.com/pinyin-pro"><\/script>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Varela Round', "Segoe UI", sans-serif; background-color: #ecfeff; overflow: hidden; height: 100vh; }
        
        .basket-pattern {
            background-color: #fdf6e3;
            background-image: 
                linear-gradient(45deg, #d4a373 25%, transparent 25%, transparent 75%, #d4a373 75%, #d4a373),
                linear-gradient(45deg, #d4a373 25%, transparent 25%, transparent 75%, #d4a373 75%, #d4a373);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            border: 8px solid #b08968;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2), 0 10px 25px rgba(0,0,0,0.1);
            border-radius: 20px;
            position: relative;
        }
        
        .fish-item { 
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); 
            cursor: pointer; 
            display: inline-block; 
            width: 100px;
            height: 60px;
            position: relative;
            filter: drop-shadow(2px 4px 4px rgba(0,0,0,0.1));
            user-select: none;
        }
        .fish-item:hover { transform: scale(1.1) rotate(5deg); }
        .fish-item:active { transform: scale(0.95); }
        
        .fish-svg { width: 100%; height: 100%; }
        .fish-body { fill: #fca5a5; stroke: #b91c1c; stroke-width: 1.5; transition: fill 0.3s ease; }
        
        /* 强制变绿逻辑 */
        .fish-in-basket .fish-body { fill: #86efac !important; stroke: #15803d !important; }
        .fish-in-basket .fish-text { color: #14532d !important; }
        .fish-in-basket .fish-pinyin { color: #166534 !important; }

        .fish-content {
            position: absolute;
            top: 50%; left: 45%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 80%;
            pointer-events: none;
        }
        .fish-text { font-weight: bold; color: #7f1d1d; font-size: 16px; line-height: 1.1; }
        .fish-pinyin { font-size: 10px; color: #991b1b; }

        .animate-pop { animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        
        .animate-swim { animation: swim 4s ease-in-out infinite alternate; }
        @keyframes swim { 
            0% { transform: translateX(0) translateY(0) rotate(0deg); } 
            100% { transform: translateX(5px) translateY(-5px) rotate(2deg); } 
        }

        .pond-bg {
            background-color: #e0f2fe;
            background-image: radial-gradient(#bae6fd 2px, transparent 2px);
            background-size: 30px 30px;
            position: relative;
            overflow: hidden;
        }
        .lily-pad {
            position: absolute; width: 60px; height: 60px; background: #86efac; border-radius: 50%;
            border: 2px solid #22c55e; opacity: 0.3; pointer-events: none;
        }
        .lily-pad::after {
            content: ''; position: absolute; top: 50%; left: 50%; width: 50%; height: 2px;
            background: #22c55e; transform-origin: left; transform: rotate(45deg);
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const config = ${configJson};

        const getPinyin = (text) => {
            if (window.pinyinPro && window.pinyinPro.pinyin) {
                return window.pinyinPro.pinyin(text);
            }
            return '';
        };

        const Fish = ({ text, py, onClick, isInBasket }) => (
            // 如果在篮子里，移除游泳动画，确保它稳定显示
            <div onClick={onClick} className={\`fish-item \${isInBasket ? 'fish-in-basket' : 'animate-swim'} animate-pop\`}>
                <svg viewBox="0 0 100 60" className="fish-svg">
                    <path d="M90,30 Q90,55 50,55 Q10,55 10,30 Q10,5 50,5 Q90,5 90,30 Z M90,30 L100,15 L100,45 Z" className="fish-body" />
                    <circle cx="75" cy="20" r="3" fill="white" />
                    <circle cx="76" cy="20" r="1.5" fill="black" />
                    <path d="M70 40 Q60 45 50 40" fill="none" stroke="rgba(0,0,0,0.1)" strokeWidth="2" strokeLinecap="round" />
                </svg>
                <div className="fish-content">
                    <div className="fish-pinyin">{py}</div>
                    <div className="fish-text">{text}</div>
                </div>
            </div>
        );

        const VolumeIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>;
        const TrophyIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>;
        const RefreshIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>;

        function Game() {
            const [roundQuestions, setRoundQuestions] = useState([]);
            const [qIndex, setQIndex] = useState(0);
            const [pool, setPool] = useState([]);
            const [answer, setAnswer] = useState([]);
            const [status, setStatus] = useState('playing'); 
            const [roundCount, setRoundCount] = useState(1);

            const startNewRound = () => {
                const allQs = [...config.questions];
                const shuffled = allQs.sort(() => 0.5 - Math.random());
                const selected = shuffled.slice(0, 8);
                
                setRoundQuestions(selected);
                setQIndex(0);
                setStatus('playing');
                if (selected.length > 0) {
                    prepareQuestion(selected[0], allQs);
                }
            };

            useEffect(() => {
                startNewRound();
            }, []);

            const prepareQuestion = (q, allQuestions) => {
                if (!q) return;
                
                const correctChunks = q.chunks || [];
                
                let distractors = [];
                if (allQuestions.length > 1) {
                    const otherChunks = allQuestions
                        .filter(item => item.id !== q.id)
                        .flatMap(item => item.chunks);
                    const uniqueOther = [...new Set(otherChunks)];
                    const shuffledOther = uniqueOther.sort(() => 0.5 - Math.random());
                    distractors = shuffledOther.filter(w => !correctChunks.includes(w)).slice(0, 4);
                }

                const allChunks = [...correctChunks, ...distractors];
                
                const shuffled = allChunks.map((text, idx) => ({ 
                    id: \`fish-\${idx}-\${Math.random().toString(36).substr(2, 9)}\`, 
                    text,
                    py: getPinyin(text) 
                })).sort(() => Math.random() - 0.5);
                
                setPool(shuffled);
                setAnswer([]);
            };

            const handleNextQuestion = () => {
                if (qIndex < roundQuestions.length - 1) {
                    const nextIndex = qIndex + 1;
                    setQIndex(nextIndex);
                    prepareQuestion(roundQuestions[nextIndex], config.questions);
                } else {
                    setStatus('round_finished');
                }
            };

            const speak = (text) => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'zh-CN';
                    window.speechSynthesis.speak(utterance);
                }
            };

            const handlePoolClick = (item) => {
                setPool(pool.filter(i => i.id !== item.id));
                setAnswer([...answer, item]);
            };

            const handleAnswerClick = (item) => {
                setAnswer(answer.filter(i => i.id !== item.id));
                setPool([...pool, item]);
            };

            const checkAnswer = () => {
                const currentQ = roundQuestions[qIndex];
                const currentStr = answer.map(i => i.text).join('');
                const correctStr = currentQ.chunks.join('');
                
                if (currentStr === correctStr) {
                    const audio = new AudioContext();
                    const osc = audio.createOscillator();
                    const gain = audio.createGain();
                    osc.connect(gain); gain.connect(audio.destination);
                    osc.frequency.setValueAtTime(600, audio.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1200, audio.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.1, audio.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audio.currentTime + 0.3);
                    osc.start(); osc.stop(audio.currentTime + 0.3);

                    setTimeout(handleNextQuestion, 800);
                } else {
                    const basket = document.getElementById('basket');
                    basket.style.transform = 'translateX(-5px)';
                    setTimeout(() => basket.style.transform = 'translateX(5px)', 50);
                    setTimeout(() => basket.style.transform = 'translateX(-5px)', 100);
                    setTimeout(() => basket.style.transform = 'translateX(5px)', 150);
                    setTimeout(() => basket.style.transform = 'translateX(0)', 200);
                }
            };

            if (status === 'round_finished') {
                return (
                    <div className="flex flex-col items-center justify-center h-full w-full bg-blue-50">
                        <div className="bg-white p-12 rounded-3xl shadow-xl text-center border-4 border-blue-200 animate-pop">
                            <div className="mb-6 flex justify-center"><TrophyIcon /></div>
                            <h1 className="text-4xl font-bold mb-4 text-blue-600">完成第 {roundCount} 轮!</h1>
                            <p className="text-gray-500 mb-8 text-xl">真棒！你要继续挑战下一轮吗？</p>
                            <button 
                                onClick={() => { setRoundCount(c => c+1); startNewRound(); }} 
                                className="px-10 py-4 rounded-full bg-green-500 hover:bg-green-600 text-white font-bold text-xl shadow-lg transform transition hover:scale-105 flex items-center gap-2 mx-auto"
                            >
                                <RefreshIcon /> 再玩一轮 (Next Round)
                            </button>
                        </div>
                    </div>
                );
            }

            if (roundQuestions.length === 0) return <div className="p-10 text-center">Loading...</div>;

            const currentQ = roundQuestions[qIndex];

            return (
                <div className="h-full w-full flex flex-col md:flex-row overflow-hidden bg-white">
                    <div className="w-full md:w-2/5 p-6 flex flex-col bg-orange-50 border-r-4 border-orange-200 z-10 shadow-xl">
                        <div className="flex justify-between items-center mb-6">
                            <div className="text-orange-800 font-bold bg-orange-200 px-3 py-1 rounded-full text-sm">
                                第 {roundCount} 轮
                            </div>
                            <div className="text-orange-600 font-bold">
                                {qIndex + 1} / {roundQuestions.length}
                            </div>
                        </div>

                        <div className="bg-white rounded-2xl p-6 shadow-md border-2 border-orange-100 mb-6 relative">
                            {currentQ.questionPinyin && <div className="text-sm text-gray-400 mb-1 font-mono text-center">{currentQ.questionPinyin}</div>}
                            <h2 className="text-3xl font-bold text-gray-800 text-center mb-2">{currentQ.question}</h2>
                            {currentQ.questionEn && <div className="text-sm text-blue-400 font-medium text-center border-t border-gray-100 pt-2 mt-2">{currentQ.questionEn}</div>}
                            <button 
                                onClick={() => speak(currentQ.question)}
                                className="absolute top-2 right-2 p-2 rounded-full bg-orange-50 text-orange-400 hover:bg-orange-100 transition-colors"
                            >
                                <VolumeIcon />
                            </button>
                        </div>

                        <div id="basket" className="flex-1 basket-pattern flex flex-col items-center justify-center p-4 transition-transform">
                            <div className="bg-white/90 px-4 py-1 rounded-full text-sm text-[#8d6e63] font-bold mb-4 shadow-sm border border-[#d4a373]">
                                把小鱼拖到这里 (Answers)
                            </div>
                            <div className="flex flex-wrap gap-2 justify-center w-full min-h-[100px] content-center">
                                {answer.length === 0 && (
                                    <div className="opacity-30 text-4xl">🧺</div>
                                )}
                                {answer.map(item => (
                                    <Fish 
                                        key={item.id} 
                                        text={item.text} 
                                        py={item.py} 
                                        isInBasket={true}
                                        onClick={() => handleAnswerClick(item)} 
                                    />
                                ))}
                            </div>
                        </div>

                        <div className="mt-6 flex justify-center h-16">
                            {answer.length > 0 && (
                                <button 
                                    onClick={checkAnswer} 
                                    className="w-full bg-green-500 hover:bg-green-600 text-white text-xl font-bold py-3 rounded-2xl shadow-lg border-b-4 border-green-700 active:border-b-0 active:translate-y-1 transition-all animate-pop"
                                >
                                    ✅ 提交 (Check)
                                </button>
                            )}
                        </div>
                    </div>

                    <div className="w-full md:w-3/5 p-8 pond-bg relative">
                        <div className="lily-pad" style={{top: '10%', left: '10%'}}></div>
                        <div className="lily-pad" style={{bottom: '20%', right: '15%', width: '80px', height: '80px'}}></div>
                        
                        <h3 className="text-center text-blue-400 font-bold mb-8 text-lg bg-white/50 inline-block px-6 py-2 rounded-full mx-auto block w-max backdrop-blur-sm">
                            🐟 Word Pond (点击小鱼抓取)
                        </h3>

                        <div className="flex flex-wrap gap-6 justify-center content-start">
                            {pool.map(item => (
                                <Fish 
                                    key={item.id} 
                                    text={item.text} 
                                    py={item.py} 
                                    onClick={() => handlePoolClick(item)} 
                                />
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Game />);
    <\/script>
</body>
</html>`;
        };

        // --- 小鱼预览组件 ---
        const PreviewFish = ({ text, py, onClick, isInBasket }) => (
            <div onClick={onClick} className={`cursor-pointer inline-flex flex-col items-center justify-center w-20 h-12 relative transition-transform hover:scale-110 active:scale-95 mx-1 my-1`}>
                <svg viewBox="0 0 100 60" className="absolute top-0 left-0 w-full h-full drop-shadow-sm">
                    <path d="M90,30 Q90,55 50,55 Q10,55 10,30 Q10,5 50,5 Q90,5 90,30 Z M90,30 L100,15 L100,45 Z" 
                          fill={isInBasket ? "#86efac" : "#fca5a5"} 
                          stroke={isInBasket ? "#15803d" : "#b91c1c"} 
                          strokeWidth="2" />
                    <circle cx="75" cy="20" r="3" fill="white" />
                    <circle cx="76" cy="20" r="1.5" fill="black" />
                </svg>
                <div className="relative z-10 text-center leading-none">
                    <div className={`text-[8px] ${isInBasket ? 'text-green-800' : 'text-red-900'}`}>{py}</div>
                    <div className={`text-xs font-bold ${isInBasket ? 'text-green-900' : 'text-red-950'}`}>{text}</div>
                </div>
            </div>
        );

        // --- 主应用组件 ---
        function App() {
            const [config, setConfig] = useState({
                title: '小鱼造句游戏',
                theme: 'kids',
                questions: DEFAULT_QUESTIONS
            });
            
            const [batchInput, setBatchInput] = useState("");
            const [pinyinLib, setPinyinLib] = useState(null);

            useEffect(() => {
                if (window.pinyinPro) {
                    setPinyinLib(window.pinyinPro);
                } else {
                    const checkInterval = setInterval(() => {
                        if (window.pinyinPro) {
                            setPinyinLib(window.pinyinPro);
                            clearInterval(checkInterval);
                        }
                    }, 500);
                }
            }, []);

            const getPinyin = (text) => {
                if (pinyinLib) {
                    return pinyinLib.pinyin(text);
                }
                return '';
            }

            const handleQuestionChange = (index, field, value) => {
                const newQuestions = [...config.questions];
                newQuestions[index][field] = value;
                
                // --- 核心修复：当修改答案时，自动根据空格重新生成语块 ---
                if (field === 'answer') {
                    // 如果有内容，按空格分割；如果没有空格，整个字符串作为一个语块
                    // 这允许用户通过删除空格来合并字词
                    const val = value.trim();
                    if (val) {
                        newQuestions[index].chunks = val.split(/\s+/).filter(c => c);
                    } else {
                        newQuestions[index].chunks = [];
                    }
                }
                // ----------------------------------------------------

                setConfig({ ...config, questions: newQuestions });
            };

            const addQuestion = () => {
                setConfig({
                    ...config,
                    questions: [...config.questions, { id: Date.now().toString(), question: '', questionEn: '', questionPinyin: '', answer: '', chunks: [], distractors: '' }]
                });
            };

            const removeQuestion = (index) => {
                const newQuestions = config.questions.filter((_, i) => i !== index);
                setConfig({ ...config, questions: newQuestions });
            };

            const handleClearAll = () => {
                if (window.confirm("确定要清空所有题目吗？")) {
                    setConfig({ ...config, questions: [] });
                }
            };

            const handleDownload = () => {
                const htmlContent = generateStandaloneHTML(config);
                const blob = new Blob([htmlContent], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${config.title}_游戏.html`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

            const handleBatchAdd = async () => {
                if (!batchInput.trim()) return;
                
                const lines = batchInput.trim().split('\n').filter(line => line.trim());
                
                const newQuestions = lines.map((line) => {
                    const text = line.trim();
                    if (!text) return null;

                    let question = "";
                    let questionEn = "";
                    let answer = "";
                    let chunks = [];
                    
                    if (text.includes('|') || text.includes('｜')) {
                        const parts = text.split(/[|｜]/);
                        question = parts[0].trim();
                        answer = parts[1].trim();
                    } else {
                        answer = text;
                        question = "请重组句子"; 
                    }

                    // 批量导入时也使用相同的逻辑：优先按空格分，没空格则视为一整句（用户可在编辑区加空格拆分）
                    chunks = answer.split(/\s+/).filter(c => c);

                    let qPinyin = "";
                    if (pinyinLib && /[\u4e00-\u9fa5]/.test(question)) {
                        qPinyin = pinyinLib.pinyin(question);
                    }

                    return {
                        id: Date.now() + Math.random().toString(),
                        question,
                        questionEn,
                        questionPinyin: qPinyin,
                        answer: chunks.join(' '), 
                        chunks, 
                        distractors: ''
                    };
                }).filter(q => q);

                setConfig(prev => ({
                    ...prev,
                    questions: [...prev.questions, ...newQuestions]
                }));
                setBatchInput("");
            };

            // --- 预览组件 ---
            const Preview = () => {
                const q = config.questions[0];
                if (!q) return <div className="p-8 text-center text-gray-400 border-2 border-dashed border-gray-300 rounded-xl m-4">暂无题目，请在左侧添加</div>;

                const chunks = q.chunks || [];
                const otherChunks = config.questions.length > 1 ? config.questions[1].chunks.slice(0, 3) : ['干', '扰', '项'];
                const pool = [...chunks, ...otherChunks].sort(() => Math.random() - 0.5);

                return (
                    <div className="w-full h-full bg-white flex flex-col md:flex-row overflow-hidden rounded-xl border border-gray-200 shadow-sm font-sans select-none pointer-events-none">
                        <div className="w-full md:w-2/5 bg-orange-50 p-4 border-r border-orange-100 flex flex-col">
                            <div className="bg-white p-3 rounded-xl shadow-sm mb-3 text-center border border-orange-100 relative">
                                <div className="text-xs text-gray-400 mb-1">{q.questionPinyin}</div>
                                <div className="font-bold text-gray-800 text-sm">{q.question}</div>
                                {q.questionEn && <div className="text-[10px] text-blue-400 mt-1 pt-1 border-t border-gray-100">{q.questionEn}</div>}
                                <Icons.Volume2 className="absolute top-2 right-2 text-orange-300 w-4 h-4" />
                            </div>
                            <div className="flex-1 bg-[#fdf6e3] border-4 border-[#b08968] rounded-xl relative shadow-inner p-2 flex items-center justify-center flex-col">
                                <div className="mb-2 bg-white/80 px-2 py-0.5 rounded text-[10px] text-[#8d6e63] font-bold">Answers</div>
                                <div className="flex flex-wrap justify-center gap-1">
                                    <PreviewFish text={chunks[0]} py={getPinyin(chunks[0])} isInBasket={true} />
                                </div>
                            </div>
                        </div>
                        
                        <div className="w-full md:w-3/5 bg-blue-50 p-4 relative overflow-hidden">
                            <div className="absolute w-16 h-16 bg-green-300 rounded-full opacity-20 -top-4 -right-4"></div>
                            <h3 className="text-center text-blue-400 font-bold text-xs mb-4 uppercase bg-white/50 rounded-full py-1">Word Pond</h3>
                            <div className="flex flex-wrap gap-2 justify-center">
                                {pool.map((c, i) => (
                                    <PreviewFish key={i} text={c} py={getPinyin(c)} isInBasket={false} />
                                ))}
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen w-full bg-slate-50 flex flex-col font-sans text-gray-800">
                    <header className="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-sm">
                        <div className="flex items-center gap-2 text-blue-600 font-bold text-xl">
                            <span>🐼</span> Chinese with Dora
                        </div>
                        <div className="text-gray-500 text-sm font-medium bg-gray-100 px-3 py-1 rounded-full">小鱼造句生成器 - 独立版</div>
                    </header>

                    <div className="flex-1 flex flex-col md:flex-row overflow-hidden">
                        {/* 左侧：编辑区 */}
                        <div className="w-full md:w-1/2 p-6 overflow-y-auto border-r border-gray-200 custom-scrollbar bg-white h-full">
                            <div className="max-w-2xl mx-auto space-y-8 pb-20">
                                
                                <section>
                                    <h2 className="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                                        <Icons.Settings className="text-blue-500" /> 基础设置
                                    </h2>
                                    <div className="bg-gray-50 p-4 rounded-xl border border-gray-100">
                                        <label className="block text-sm font-bold text-gray-600 mb-2">游戏标题</label>
                                        <input 
                                            value={config.title}
                                            onChange={(e) => setConfig({...config, title: e.target.value})}
                                            className="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-200 outline-none transition-all"
                                        />
                                    </div>
                                </section>

                                <section>
                                    <div className="flex justify-between items-center mb-4">
                                        <h2 className="text-lg font-bold text-gray-800 flex items-center gap-2">
                                            <Icons.Grip className="text-blue-500" /> 题目管理 ({config.questions.length})
                                        </h2>
                                        <div className="flex gap-2">
                                            <button onClick={handleClearAll} className="bg-red-50 text-red-600 px-3 py-1.5 rounded-lg text-sm font-bold hover:bg-red-100 transition-colors flex items-center gap-1">
                                                <Icons.Trash2 width="16" height="16" /> 清空
                                            </button>
                                            <button onClick={addQuestion} className="bg-blue-50 text-blue-600 px-3 py-1.5 rounded-lg text-sm font-bold hover:bg-blue-100 transition-colors flex items-center gap-1">
                                                <Icons.Plus width="16" height="16" /> 单题添加
                                            </button>
                                        </div>
                                    </div>

                                    {/* 批量输入框 */}
                                    <div className="mb-6">
                                        <div className="p-4 bg-purple-50 border border-purple-100 rounded-xl">
                                            <div className="flex items-center gap-2 mb-2">
                                                <Icons.Wand2 className="text-purple-600" width="18" height="18" />
                                                <span className="font-bold text-purple-800 text-sm">智能批量导入</span>
                                            </div>
                                            <textarea 
                                                value={batchInput}
                                                onChange={e => setBatchInput(e.target.value)}
                                                className="w-full h-24 p-3 border border-purple-200 rounded-lg text-sm focus:ring-2 focus:ring-purple-300 outline-none mb-2 font-mono"
                                                placeholder={`格式1：中文问题 | 中文回答\n例如：你叫什么名字？ | 我 叫 大卫\n\n格式2：仅中文回答 (自动生成通用问题)\n例如：我喜欢吃苹果\n\n注意：用空格分开不同的语块，不加空格则视为一个词。`}
                                            ></textarea>
                                            <button onClick={handleBatchAdd} disabled={!batchInput.trim()} className="w-full bg-purple-600 text-white py-2 rounded-lg text-sm font-bold hover:bg-purple-700 disabled:opacity-50 transition-colors">
                                                一键生成题目
                                            </button>
                                        </div>
                                    </div>

                                    <div className="space-y-4">
                                        {config.questions.map((q, idx) => (
                                            <div key={q.id} className="p-5 border border-gray-200 rounded-xl bg-white shadow-sm hover:shadow-md transition-shadow relative group">
                                                <div className="absolute -left-3 top-6 bg-blue-500 text-white text-xs font-bold w-6 h-6 flex items-center justify-center rounded-full">
                                                    {idx + 1}
                                                </div>
                                                <div className="grid gap-4 ml-2">
                                                    <div>
                                                        <label className="text-xs font-bold text-gray-400 block mb-1">Question (中文问题)</label>
                                                        <div className="flex gap-2">
                                                            <div className="flex-1">
                                                                <input 
                                                                    value={q.question}
                                                                    onChange={e => handleQuestionChange(idx, 'question', e.target.value)}
                                                                    className="w-full p-2 bg-gray-50 rounded border border-gray-200 text-sm focus:bg-white focus:border-blue-300 outline-none"
                                                                    placeholder="中文问题"
                                                                />
                                                                <input 
                                                                    value={q.questionEn || ''}
                                                                    onChange={e => handleQuestionChange(idx, 'questionEn', e.target.value)}
                                                                    className="w-full mt-1 p-1 bg-transparent text-xs text-blue-400 border-none focus:ring-0 placeholder-blue-200"
                                                                    placeholder="英文辅助提示 (可选)"
                                                                />
                                                            </div>
                                                            <input 
                                                                value={q.questionPinyin || ''}
                                                                onChange={e => handleQuestionChange(idx, 'questionPinyin', e.target.value)}
                                                                placeholder="拼音"
                                                                className="w-1/3 p-2 bg-gray-50 rounded border border-gray-200 text-xs text-gray-500 focus:bg-white outline-none h-10"
                                                            />
                                                        </div>
                                                    </div>
                                                    <div>
                                                        <label className="text-xs font-bold text-gray-400 block mb-1 flex justify-between">
                                                            <span>Answer (中文答案 - <span className="text-orange-500">空格分词</span>)</span>
                                                            <span className="text-blue-400 font-normal">预览: [{q.chunks.join(' | ')}]</span>
                                                        </label>
                                                        <input 
                                                            value={q.answer}
                                                            onChange={e => handleQuestionChange(idx, 'answer', e.target.value)}
                                                            className="w-full p-2 bg-green-50 rounded border border-green-200 text-sm font-medium text-green-800 focus:bg-white outline-none"
                                                        />
                                                    </div>
                                                </div>
                                                <button onClick={() => removeQuestion(idx)} className="absolute top-2 right-2 text-gray-300 hover:text-red-500 p-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                                    <Icons.Trash2 width="18" height="18" />
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                </section>
                            </div>
                        </div>

                        {/* 右侧：实时预览与导出 */}
                        <div className="w-full md:w-1/2 bg-slate-100 flex flex-col p-8 border-l border-gray-200 relative overflow-hidden h-full justify-center">
                            <div className="flex flex-col justify-center items-center relative z-10">
                                <div className="bg-white px-4 py-2 rounded-full shadow-sm text-xs font-bold text-gray-500 mb-4 flex items-center gap-2">
                                    <Icons.Info width="14" height="14"/> 实时效果预览 (Preview)
                                </div>
                                
                                <div className="w-full max-w-lg aspect-[16/9] shadow-2xl rounded-2xl overflow-hidden border-4 border-white transform hover:scale-[1.02] transition-transform duration-500 bg-white">
                                    <Preview />
                                </div>

                                <div className="mt-8 text-center max-w-md">
                                    <h3 className="font-bold text-gray-700 mb-2">生成说明</h3>
                                    <p className="text-sm text-gray-500 mb-6">
                                        自动包含小鱼动画、语音朗读、干扰项生成和多轮游戏逻辑。
                                        <br/><span className="text-xs text-gray-400">生成的 HTML 文件可直接在任意浏览器离线运行。</span>
                                    </p>
                                    <button 
                                        onClick={handleDownload}
                                        className="bg-green-600 hover:bg-green-700 text-white font-bold py-4 px-12 rounded-full shadow-xl flex items-center gap-3 mx-auto transform hover:scale-105 transition-all text-lg"
                                    >
                                        <Icons.Download width="24" height="24" /> 生成独立游戏文件 (HTML)
                                    </button>
                                </div>
                            </div>
                            
                            <div className="absolute top-0 right-0 w-64 h-64 bg-blue-200 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob"></div>
                            <div className="absolute bottom-0 left-0 w-64 h-64 bg-purple-200 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-2000"></div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
