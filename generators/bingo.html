<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宾果 Bingo 生成器 - Chinese Bingo Generator</title>
<style id="kd-kids-theme">
/* 儿童类生成器统一风格 - 由中文游戏工坊注入（外壳统一：圆润中文字体 + 标题品牌色；玩法区与对错配色不动） */
:root{
  --kd-primary:#FF7A45;
  --kd-primary-d:#E85C2A;
}
body{
  font-family:'Varela Round','Noto Sans TC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif !important;
}
h1,.title,.brand-title,.app-title,header h1,.header-title,.app-header h1{
  color:var(--kd-primary-d) !important;
}
</style>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #FFF7ED;
            color: #7c2d12;
            font-family: 'Varela Round','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
        }
        .topbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 20px; background: #fff; border-bottom: 2px solid #fed7aa;
            position: sticky; top: 0; z-index: 50;
        }
        .brand { display: flex; align-items: center; gap: 8px; font-weight: bold; color: #ea580c; font-size: 1.1rem; }
        .tag { background: #ffedd5; color: #c2410c; font-size: .8rem; padding: 4px 12px; border-radius: 999px; font-weight: bold; }
        .wrap { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 24px; }
        @media (max-width: 820px){ .wrap { grid-template-columns: 1fr; } }
        .panel { background: #fff; border-radius: 20px; padding: 22px; border: 2px solid #fed7aa; box-shadow: 0 6px 0 #fed7aa; }
        .panel h2 { margin: 0 0 16px; font-size: 1.25rem; color: #ea580c; display: flex; align-items: center; gap: 8px; }
        label { display: block; font-weight: bold; font-size: .9rem; color: #9a3412; margin: 14px 0 6px; }
        input[type=text], textarea, input[type=number] {
            width: 100%; border: 2px solid #fed7aa; border-radius: 12px; padding: 10px 12px;
            font-family: inherit; font-size: 1rem; color: #7c2d12; background: #fffdf9; outline: none;
        }
        textarea { resize: vertical; min-height: 130px; line-height: 1.5; }
        input:focus, textarea:focus { border-color: #fb923c; }
        .hint { font-size: .8rem; color: #b45309; margin-top: 4px; }
        .hint.warn { color: #dc2626; font-weight: bold; }
        .seg { display: flex; gap: 8px; flex-wrap: wrap; }
        .seg button {
            flex: 1; min-width: 80px; padding: 10px; border-radius: 12px; border: 2px solid #fed7aa;
            background: #fffdf9; font-family: inherit; font-weight: bold; font-size: 1rem; color: #9a3412; cursor: pointer;
        }
        .seg button.on { background: #fb923c; color: #fff; border-color: #c2410c; }
        .switchline { display: flex; align-items: center; gap: 10px; margin: 14px 0; }
        .switch { position: relative; width: 52px; height: 30px; flex: 0 0 auto; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; inset: 0; background: #fed7aa; border-radius: 999px; transition: .2s; cursor: pointer; }
        .slider::before { content: ""; position: absolute; width: 24px; height: 24px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
        .switch input:checked + .slider { background: #34d399; }
        .switch input:checked + .slider::before { transform: translateX(22px); }
        .switchline .lab { font-weight: bold; font-size: .95rem; color: #9a3412; }
        .preview-head { display: flex; align-items: center; justify-content: space-between; }
        #preview { display: grid; gap: 5px; background: #fed7aa; padding: 8px; border-radius: 14px; margin-top: 8px; }
        .pcell {
            aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; text-align: center;
            background: #fff; border-radius: 8px; font-weight: bold; font-size: clamp(12px,3.5vw,18px); color: #9a3412;
            padding: 3px; word-break: break-word; cursor: pointer; user-select: none;
        }
        .pcell.marked { background: #34d399; color: #065f46; }
        .pcell.free { background: #fde68a; color: #92400e; cursor: default; }
        .actions { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
        .btn {
            border: none; border-radius: 14px; padding: 14px; font-family: inherit; font-weight: bold; font-size: 1.05rem;
            cursor: pointer; background: #22c55e; color: #fff; box-shadow: 0 4px 0 #15803d;
        }
        .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #15803d; }
        .btn.ghost { background: #fff; color: #ea580c; border: 2px solid #fb923c; box-shadow: 0 4px 0 #fed7aa; }
        .use { background: #fffbeb; border: 2px dashed #fcd34d; border-radius: 14px; padding: 14px; font-size: .85rem; color: #92400e; line-height: 1.6; }
        .use b { color: #b45309; }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="brand"><span>🐼</span> Chinese with Dora</div>
        <div class="tag">宾果 Bingo 生成器</div>
    </div>

    <div class="wrap">
        <!-- 左：设置 -->
        <div class="panel">
            <h2>⚙️ 基础设置</h2>

            <label>游戏标题</label>
            <input type="text" id="title" value="汉语词汇宾果">

            <label>词语列表（每行一个，或用空格 / 逗号分隔）</label>
            <textarea id="words" placeholder="例如：&#10;苹果&#10;学校&#10;老师&#10;吃饭&#10;朋友"></textarea>
            <div class="hint" id="wordHint"></div>

            <label>网格大小</label>
            <div class="seg" id="sizeSeg">
                <button data-size="3">3 × 3</button>
                <button data-size="4">4 × 4</button>
                <button data-size="5" class="on">5 × 5</button>
            </div>

            <div class="switchline">
                <label class="switch"><input type="checkbox" id="free" checked><span class="slider"></span></label>
                <span class="lab">中间放「免费格 FREE」</span>
            </div>
            <div class="switchline">
                <label class="switch"><input type="checkbox" id="audio"><span class="slider"></span></label>
                <span class="lab">学生可点喇叭听词（需要设备有声音）</span>
            </div>

            <label>打印卡片数量（打印时生成几张不同卡片）</label>
            <input type="number" id="printCount" value="1" min="1" max="30">
            <div class="hint">默认 1 张；设大一点可一次打印全班不同的卡。</div>

            <label>课堂说明（显示在卡片下方，可留空）</label>
            <textarea id="instr" placeholder="例如：老师说中文，听到就点一下对应的格子。先连成一行 / 一列 / 斜线的人喊 BINGO！"></textarea>
        </div>

        <!-- 右：预览 + 下载 -->
        <div class="panel">
            <div class="preview-head">
                <h2>👀 实时预览</h2>
                <span class="tag" id="sizeTag">5 × 5</span>
            </div>
            <div id="preview"></div>

            <div class="use">
                <b>怎么用：</b><br>
                1. 填好词语（5×5 建议至少 24 个词，有免费格时只需 24 个）；<br>
                2. 点下方「生成独立游戏文件」下载 .html；<br>
                3. 把文件发给学生 —— 每人打开都会得到<b>随机不同</b>的卡片；<br>
                4. 课堂上老师说词，学生点格子标记，连成线即 BINGO！也可直接打印分发。
            </div>

            <div class="actions">
                <button class="btn" id="download">⬇️ 生成独立游戏文件（HTML）</button>
                <button class="btn ghost" id="reset">🗑️ 清空词语</button>
            </div>
        </div>
    </div>

    <script>
        // ---------- 工具 ----------
        function $(id){ return document.getElementById(id); }
        function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
        function escapeHtml(s){ return String(s).replace(/[&<>"']/g, function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]; }); }
        function parseWords(raw){
            return raw.split(/[\n,，、;；]/).map(function(s){ return s.trim(); }).filter(function(s){ return s.length>0; });
        }

        // 生成一张卡的格子数据：返回 [{text, free}]
        function generateCardData(words, size, freeSpace){
            var total = size*size;
            var needed = total - (freeSpace ? 1 : 0);
            var pool = [];
            if(words.length === 0){
                for(var i=0;i<needed;i++) pool.push('词语'+(i+1));
            } else {
                var k=0;
                while(pool.length < needed){ pool.push(words[k % words.length]); k++; if(k > needed*5) break; }
            }
            pool = shuffle(pool).slice(0, needed);
            var center = Math.floor(size/2);
            var arr = [], wi = 0;
            for(var i=0;i<total;i++){
                var r = Math.floor(i/size), c = i%size;
                if(freeSpace && r===center && c===center){ arr.push({text:'免费', free:true}); }
                else { arr.push({text: pool[wi++], free:false}); }
            }
            return arr;
        }

        // ---------- 状态 ----------
        var state = { size: 5 };

        // ---------- 预览 ----------
        function renderPreview(){
            var words = parseWords($('words').value);
            var size = state.size;
            var arr = generateCardData(words, size, $('free').checked);
            var pv = $('preview');
            pv.style.gridTemplateColumns = 'repeat('+size+', 1fr)';
            pv.innerHTML = '';
            arr.forEach(function(cell){
                var d = document.createElement('div');
                d.className = 'pcell' + (cell.free ? ' free marked' : '');
                d.textContent = cell.text;
                if(!cell.free){
                    d.onclick = function(){ this.classList.toggle('marked'); };
                }
                pv.appendChild(d);
            });
            updateHint(words, size);
        }

        function updateHint(words, size){
            var needed = size*size - ($('free').checked ? 1 : 0);
            var h = $('wordHint');
            if(words.length === 0){
                h.className = 'hint'; h.textContent = '建议至少 ' + needed + ' 个词；留空将用示例词占位。';
            } else if(words.length < needed){
                h.className = 'hint warn';
                h.textContent = '需要 ' + needed + ' 个词，当前只有 ' + words.length + ' 个 —— 将自动重复填充（建议补足）。';
            } else {
                h.className = 'hint';
                h.textContent = '已填 ' + words.length + ' 个词，足够铺满 ' + size + '×' + size + ' 卡（需 ' + needed + ' 个）。';
            }
        }

        // ---------- 生成学生端 HTML ----------
        function buildStudentHTML(cfg){
            var CFG_JSON = JSON.stringify(cfg);
            var studentCss = [
                "*{box-sizing:border-box;}",
                "body{margin:0;font-family:'Varela Round','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;background:#FFF7ED;color:#7c2d12;}",
                ".app{max-width:640px;margin:0 auto;padding:16px;}",
                "header h1{text-align:center;color:#ea580c;font-size:1.8rem;margin:8px 0 0;}",
                ".bingo-label{text-align:center;font-weight:bold;letter-spacing:.45em;color:#f97316;font-size:1.3rem;margin-bottom:6px;}",
                ".instr{text-align:center;color:#9a3412;font-size:.9rem;margin:6px 12px 14px;line-height:1.5;}",
                ".controls{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap;}",
                ".controls button{font-family:inherit;border:none;border-radius:999px;padding:10px 16px;font-size:1rem;font-weight:bold;cursor:pointer;background:#fb923c;color:#fff;box-shadow:0 4px 0 #c2410c;}",
                ".controls button:active{transform:translateY(2px);box-shadow:0 2px 0 #c2410c;}",
                ".board{display:grid;gap:6px;background:#fed7aa;padding:8px;border-radius:16px;border:4px solid #fb923c;}",
                ".cell{position:relative;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;text-align:center;background:#fff;border-radius:10px;font-size:clamp(13px,4vw,22px);font-weight:bold;color:#9a3412;cursor:pointer;padding:4px;user-select:none;word-break:break-word;}",
                ".cell.marked{background:#34d399;color:#065f46;}",
                ".cell.free{background:#fde68a;color:#92400e;cursor:default;}",
                ".cell.win{outline:4px solid #f59e0b;outline-offset:-4px;}",
                ".speaker{position:absolute;top:2px;right:3px;font-size:.8rem;opacity:.45;cursor:pointer;}",
                ".overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:99;}",
                ".overlay.show{display:flex;}",
                ".overlay .card{background:#fff;padding:28px 36px;border-radius:20px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3);}",
                ".overlay h2{color:#ea580c;font-size:2rem;margin:0 0 10px;}",
                ".overlay button{margin-top:14px;font-family:inherit;border:none;border-radius:12px;padding:10px 22px;font-weight:bold;font-size:1rem;background:#22c55e;color:#fff;cursor:pointer;}",
                "#print-area{display:none;}",
                "@media print{body{background:#fff;}.app{display:none;}#print-area{display:block;}.pcard{page-break-after:always;margin-bottom:24px;}.pcard h3{text-align:center;color:#ea580c;margin:0 0 8px;}}"
            ].join('');

            var studentJs = [
                "var CFG = " + CFG_JSON + ";",
                "var board=document.getElementById('board');",
                "var winOverlay=document.getElementById('winOverlay');",
                "function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}",
                "function buildWords(){",
                "  var words=CFG.words.slice();",
                "  var cells=CFG.size*CFG.size;",
                "  var needed=cells-(CFG.freeSpace?1:0);",
                "  var pool=[];",
                "  if(words.length===0){for(var i=0;i<needed;i++)pool.push('词语'+(i+1));}",
                "  else{var k=0;while(pool.length<needed){pool.push(words[k%words.length]);k++;if(k>needed*5)break;}}",
                "  return shuffle(pool).slice(0,needed);",
                "}",
                "function render(){",
                "  var words=buildWords();var size=CFG.size;var cells=size*size;",
                "  board.style.gridTemplateColumns='repeat('+size+',1fr)';",
                "  board.innerHTML='';",
                "  var wi=0;var center=Math.floor(size/2);",
                "  for(var i=0;i<cells;i++){",
                "    var r=Math.floor(i/size),c=i%size;",
                "    var d=document.createElement('div');d.className='cell';",
                "    if(CFG.freeSpace&&r===center&&c===center){d.className+=' free marked';d.textContent='免费';d.setAttribute('data-free','1');}",
                "    else{var txt=words[wi++];d.textContent=txt;d.setAttribute('data-word',txt);",
                "      if(CFG.audioOn){var sp=document.createElement('span');sp.className='speaker';sp.textContent='🔊';sp.onclick=function(e){e.stopPropagation();speak(this.parentNode.getAttribute('data-word'));};d.appendChild(sp);}",
                "    }",
                "    d.onclick=function(){if(this.getAttribute('data-free'))return;this.classList.toggle('marked');checkWin();};",
                "    board.appendChild(d);",
                "  }",
                "}",
                "function isMarked(i){return board.children[i].classList.contains('marked');}",
                "function checkWin(){",
                "  var size=CFG.size,total=size*size;var won=false,winCells=[];",
                "  for(var r=0;r<size&&!won;r++){var line=[];for(var c=0;c<size;c++){var idx=r*size+c;if(isMarked(idx))line.push(idx);else break;}if(line.length===size){won=true;winCells=line;}}",
                "  for(var c=0;c<size&&!won;c++){var line2=[];for(var r=0;r<size;r++){var idx=r*size+c;if(isMarked(idx))line2.push(idx);else break;}if(line2.length===size){won=true;winCells=line2;}}",
                "  var d1=[];for(var i=0;i<size;i++){var idx=i*size+i;if(isMarked(idx))d1.push(idx);else break;}if(d1.length===size){won=true;winCells=d1;}",
                "  var d2=[];for(var i=0;i<size;i++){var idx=i*size+(size-1-i);if(isMarked(idx))d2.push(idx);else break;}if(d2.length===size){won=true;winCells=d2;}",
                "  if(won){winCells.forEach(function(i){board.children[i].classList.add('win');});winOverlay.classList.add('show');}",
                "}",
                "function speak(t){if('speechSynthesis'in window){window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';window.speechSynthesis.speak(u);}}",
                "function newCard(){winOverlay.classList.remove('show');render();}",
                "function printCards(){",
                "  var pa=document.getElementById('print-area');pa.innerHTML='';",
                "  var n=Math.max(1,CFG.printCount||1);",
                "  for(var p=0;p<n;p++){",
                "    var card=document.createElement('div');card.className='pcard';",
                "    var h=document.createElement('h3');h.textContent=CFG.title;card.appendChild(h);",
                "    var b=document.createElement('div');b.className='board';b.style.gridTemplateColumns='repeat('+CFG.size+',1fr)';b.style.maxWidth='420px';b.style.margin='0 auto';",
                "    var words=buildWords();var size=CFG.size;var cells=size*size;var wi=0;var center=Math.floor(size/2);",
                "    for(var i=0;i<cells;i++){var r=Math.floor(i/size),c=i%size;var cd=document.createElement('div');cd.className='cell';if(CFG.freeSpace&&r===center&&c===center){cd.className+=' free marked';cd.textContent='免费';}else{cd.textContent=words[wi++];}b.appendChild(cd);}",
                "    card.appendChild(b);pa.appendChild(card);",
                "  }",
                "  window.print();",
                "}",
                "document.getElementById('btnNew').onclick=newCard;",
                "document.getElementById('btnPrint').onclick=printCards;",
                "render();"
            ].join('\n');

            return '<!DOCTYPE html>\n' +
                '<html lang="zh-CN">\n' +
                '<head>\n' +
                '  <meta charset="UTF-8">\n' +
                '  <meta name="viewport" content="width=device-width, initial-scale=1.0">\n' +
                '  <title>' + escapeHtml(cfg.title) + ' - 宾果 Bingo</title>\n' +
                '  <style>' + studentCss + '</style>\n' +
                '</head>\n' +
                '<body>\n' +
                '  <div class="app">\n' +
                '    <header>\n' +
                '      <h1>' + escapeHtml(cfg.title) + '</h1>\n' +
                '      <div class="bingo-label">BINGO</div>\n' +
                (cfg.instructions ? '      <div class="instr">' + escapeHtml(cfg.instructions) + '</div>\n' : '') +
                '    </header>\n' +
                '    <div class="controls">\n' +
                '      <button id="btnNew">🔄 换一张</button>\n' +
                '      <button id="btnPrint">🖨️ 打印</button>\n' +
                '    </div>\n' +
                '    <div class="board" id="board"></div>\n' +
                '  </div>\n' +
                '  <div class="overlay" id="winOverlay"><div class="card"><h2>🎉 BINGO!</h2><p>你连成一条线啦，真棒！</p><button onclick="newCard()">再来一张</button></div></div>\n' +
                '  <div id="print-area"></div>\n' +
                '  <script>' + studentJs + '<\/script>\n' +
                '</body>\n' +
                '</html>';
        }

        function getConfig(){
            return {
                title: $('title').value.trim() || '宾果 Bingo',
                words: parseWords($('words').value),
                size: state.size,
                freeSpace: $('free').checked,
                audioOn: $('audio').checked,
                printCount: Math.max(1, parseInt($('printCount').value, 10) || 1),
                instructions: $('instr').value.trim()
            };
        }

        function download(){
            var cfg = getConfig();
            var html = buildStudentHTML(cfg);
            var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = (cfg.title || '宾果') + '_宾果.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // ---------- 事件绑定 ----------
        ['title','words','free','audio','instr','printCount'].forEach(function(id){
            $(id).addEventListener('input', function(){ if(id==='words'||id==='free') renderPreview(); });
            $(id).addEventListener('change', function(){ if(id==='free') renderPreview(); });
        });
        $('sizeSeg').addEventListener('click', function(e){
            var btn = e.target.closest('button'); if(!btn) return;
            state.size = parseInt(btn.dataset.size, 10);
            Array.prototype.forEach.call(this.children, function(b){ b.classList.remove('on'); });
            btn.classList.add('on');
            $('sizeTag').textContent = state.size + ' × ' + state.size;
            renderPreview();
        });
        $('download').addEventListener('click', download);
        $('reset').addEventListener('click', function(){ $('words').value=''; renderPreview(); });

        // 初始预览
        renderPreview();
    </script>
</body>
</html>
