            const dir = Math.floor(Math.random() * 2);
            const r = Math.floor(Math.random() * size);
            const c = Math.floor(Math.random() * size);

            for (let i = 0; i < word.length; i++) {

              if (nr >= size || nc >= size || (grid[nr][nc] !== '' && grid[nr][nc] !== word[i])) {
                fits = false; break;

        const sourceList = mode === 'editor' ? parseRawInput(rawInput) : vocabList;
        
        const roundWords = sourceList.length > 10 
          ? [...sourceList].sort(() => 0.5 - Math.random()).slice(0, 10)
          : sourceList;

        setActiveVocab(roundWords);
        setGridData(generateGrid(roundWords));
        setFoundWords([]); setFoundCells([]); setSelectedCells([]);
        setGameLevel(1); setQuizIndex(0); setDialogueIndex(0);
        setDialogueInput(""); setDialogueFeedback(null); setShowTransition(false);
      };

      const startGame = () => {
        const parsedList = parseRawInput(rawInput);
        if (parsedList.length === 0) {
          alert("請至少輸入一個有效的詞彙 (格式: 中文 | 拼音 | 英文 | 提示)");
          return;
        }
        setVocabList(parsedList);
        startNewRound(); // Logic handles selection
        setMode('game'); 
        setView('welcome'); // Start with welcome screen
      };

      const handleStart = () => {
        setView('game');
        speakCantonese("準備好未？開始啦！");
      };

      const handleRestart = () => {
        startNewRound();
        setView('welcome');
      };

      const downloadGame = () => {
        const parsedList = parseRawInput(rawInput);
        if (parsedList.length === 0) {
          alert("請至少輸入一個有效的詞彙");
          return;
        }
        const htmlContent = generateStudentHTML(parsedList);
        const blob = new Blob([htmlContent], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'cantonese_game_student.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      const triggerTransition = () => { setTimeout(() => { setShowTransition(true); }, 1000); };
      const nextLevel = () => { setShowTransition(false); setGameLevel(prev => prev + 1); };

      const handleCellClick = (r, c) => {
        const cellId = `${r}-${c}`;
        if (selectedCells.includes(cellId)) { setSelectedCells(selectedCells.filter(id => id !== cellId)); return; }
        const newSelection = [...selectedCells, cellId];
        setSelectedCells(newSelection);
        const selectedChars = newSelection.map(id => {
          const [row, col] = id.split('-').map(Number); return gridData[row][col];
        }).join('');
        const matchedWord = activeVocab.find(w => w.char === selectedChars);
        if (matchedWord && !foundWords.includes(matchedWord.char)) {
          setFoundWords([...foundWords, matchedWord.char]);
          setFoundCells([...foundCells, ...newSelection]);
          setSelectedCells([]);
          speakCantonese(matchedWord.char);
          if (foundWords.length + 1 === activeVocab.length) { triggerTransition(); }
        }
      };

      const handleQuizAnswer = (selectedEnglish) => {
        const currentWord = activeVocab[quizIndex];
        speakCantonese(currentWord.char);
        if (selectedEnglish === currentWord.english) {
          if (quizIndex + 1 < activeVocab.length) { setTimeout(() => setQuizIndex(quizIndex + 1), 500); }
          else { triggerTransition(); }
        } else { speakCantonese("再試一次"); }
      };

      const handleDialogueSubmit = () => {
        const currentWord = activeVocab[dialogueIndex];
        const check = validateSentence(dialogueInput, currentWord.char, currentWord.answer);
        if (check.valid) {
          setDialogueFeedback("correct"); setFeedbackMsg(""); speakCantonese(dialogueInput);
          setTimeout(() => {
            setDialogueFeedback(null); setDialogueInput("");
            if (dialogueIndex + 1 < activeVocab.length) { setDialogueIndex(dialogueIndex + 1); }
            else { triggerTransition(); }
          }, 2000);
        } else {
          setDialogueFeedback("wrong"); setFeedbackMsg(check.msg); speakCantonese(check.msg);
        }
      };

      useEffect(() => {
        if (gameLevel === 4 && !showTransition && mode === 'game' && view === 'game') {
          speakCantonese("通關成功，你真係好叻呀！");
        }
      }, [gameLevel, showTransition, mode, view]);

      // Renders
      const renderTransition = () => (
        <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center animate-fade-in p-4">
          <div className="bg-white p-8 rounded-3xl text-center border-4 border-gray-900 shadow-2xl max-w-md w-full relative overflow-hidden">
             <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-pink-300 via-yellow-200 to-blue-300"></div>
             <IconSparkles className="w-16 h-16 mx-auto mb-4 text-yellow-400 animate-spin-slow" />
             <h2 className="text-3xl sm:text-4xl font-black text-gray-800 mb-4">恭喜過關！</h2>
             <p className="text-xl font-bold text-gray-600 mb-8">做得好！準備好進入下一關了嗎？</p>
             <button onClick={nextLevel} className={`${COLORS.accent} ${BUTTON_STYLE} w-full text-xl flex items-center justify-center gap-2`}>
               進入下一關 <IconArrowRight className="w-6 h-6"/>
             </button>
          </div>
        </div>
      );

      const renderWelcome = () => (
        <div className="flex flex-col items-center justify-center min-h-[60vh] text-center animate-bounce-in">
           <div className="mb-8 relative">
              <IconRocket className="text-pink-400 w-32 h-32 animate-pulse-slow filter drop-shadow-xl" />
              <IconSparkles className="text-yellow-400 w-12 h-12 absolute -top-2 -right-4 animate-spin-slow" />
           </div>
           <h1 className="text-5xl font-black text-gray-900 mb-6 tracking-wider">粵語大冒險</h1>
           <p className="text-2xl text-gray-600 mb-12 font-bold">準備好接受挑戰了嗎？</p>
           <button onClick={handleStart} className={`${COLORS.accent} ${BUTTON_STYLE} text-2xl w-64 flex items-center justify-center gap-3 hover:scale-105 transform duration-200`}>
             開始冒險 <IconArrowRight />
           </button>
        </div>
      );

      const renderEditor = () => {
        const previewList = parseRawInput(rawInput);
        const previewLevel = autoDetectLevel(previewList);
        return (
        <div className="max-w-4xl mx-auto p-4">
          <div className={`${COLORS.primary} ${BORDER_STYLE} p-6 sm:p-8 mb-8`}>
            <h1 className="text-3xl font-black mb-4 flex items-center gap-2">
              <IconSettings className="w-8 h-8"/> 遊戲生成器設置
            </h1>
            <div className="bg-white p-4 rounded-xl border-4 border-gray-900 mb-6">
              <div className="flex items-center gap-2 mb-2 text-gray-700 font-bold">
                <IconEdit size={20}/> 
                <span>批量輸入 (Bulk Input)</span>
              </div>
              <p className="text-sm text-gray-500 mb-2">
                請輸入資料，每行一個詞彙。格式：<br/>
                <code className="bg-gray-100 px-1 rounded">中文詞彙 | 粵拼 | 英文意思 | 英文句子 (造句題) | 中文參考答案</code>
              </p>
              <textarea
                value={rawInput}
                onChange={(e) => setRawInput(e.target.value)}
                className="w-full h-48 p-4 border-2 border-gray-300 rounded-lg font-mono text-sm leading-relaxed focus:border-pink-500 focus:ring-2 focus:ring-pink-200 outline-none resize-y"
                placeholder="蘋果 | ping4 gwo2 | Apple | I like to eat apples. | 我鍾意食蘋果"
              />
            </div>
            <div className="mb-6 overflow-hidden rounded-xl border-4 border-gray-900 bg-white">
               <div className="bg-gray-100 p-3 font-bold border-b-2 border-gray-200 flex justify-between items-center">
                 <div className="flex items-center gap-4">
                    <span>預覽 ({previewList.length} 個詞彙)</span>
                    {previewList.length > 0 && (
                        <span className="text-xs bg-purple-100 text-purple-700 px-2 py-1 rounded-full border border-purple-200 flex items-center gap-1">
                            <IconWand size={12}/> 系統判定難度: Level {previewLevel}
                        </span>
                    )}
                 </div>
                 <span className="text-xs text-gray-500 font-normal hidden sm:inline">系統會自動過濾重複詞彙及格式錯誤的行</span>
               </div>
               <div className="overflow-x-auto">
                 <table className="w-full text-left text-sm">
                   <thead>
                     <tr className="bg-yellow-50 border-b-2 border-gray-100">
                       <th className="p-2 pl-4">中文</th>
                       <th className="p-2">粵拼</th>
                       <th className="p-2">英文</th>
                       <th className="p-2">題目</th>
                       <th className="p-2">參考答案 (用於檢測)</th>
                     </tr>
                   </thead>
                   <tbody>
                     {previewList.length > 0 ? (
                       previewList.map((item, idx) => (
                         <tr key={idx} className="border-b border-gray-100 last:border-0 hover:bg-pink-50">
                           <td className="p-2 pl-4 font-bold">{item.char}</td>
                           <td className="p-2 font-mono text-gray-600">{item.jyutping}</td>
                           <td className="p-2">{item.english}</td>
                           <td className="p-2 text-gray-500 truncate max-w-[150px]">{item.prompt}</td>
                           <td className="p-2 text-gray-500 truncate max-w-[150px]">{item.answer}</td>
                         </tr>
                       ))
                     ) : (
                       <tr>
                         <td colSpan={5} className="p-4 text-center text-gray-400 italic">
                           暫無有效數據，請在上方輸入框輸入...
                         </td>
                       </tr>
                     )}
                   </tbody>
                 </table>
               </div>
            </div>
            <div className="flex justify-center gap-4 flex-wrap">
              <button onClick={startGame} disabled={previewList.length === 0} className={`${COLORS.accent} text-xl w-64 ${BUTTON_STYLE} flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed`}>
                <IconPlay className="fill-current"/> 預覽遊戲
              </button>
              <button onClick={downloadGame} disabled={previewList.length === 0} className={`${COLORS.secondary} text-xl w-64 ${BUTTON_STYLE} flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed`}>
                <IconDownload className="fill-current"/> 下載學生版遊戲
              </button>
            </div>
          </div>
        </div>
        );
      };

      const renderLevel1 = () => (
        <div className="flex flex-col items-center w-full max-w-6xl mx-auto">
          <div className={`${COLORS.secondary} ${BORDER_STYLE} px-6 py-2 mb-6 flex items-center gap-3`}>
            <span className="text-2xl font-black">第一關：找字大冒險</span>
            <span className="bg-white px-3 py-1 rounded-full text-sm font-bold border-2 border-black">
              {foundWords.length} / {activeVocab.length}
            </span>
          </div>
          <div className="flex flex-col md:flex-row gap-8 items-start justify-center w-full">
            {/* Grid Area */}
            <div className="flex-shrink-0 bg-white p-4 rounded-xl border-4 border-gray-900 shadow-lg mx-auto">
              <div className="grid grid-cols-10 gap-1 sm:gap-2 select-none">
                {gridData.map((row, r) => (
                  row.map((char, c) => {
                    const cellId = `${r}-${c}`;
                    const isSelected = selectedCells.includes(cellId);
                    const isFound = foundCells.includes(cellId);
                    
                    let cellStyle = 'bg-gray-50 hover:bg-gray-100'; 
                    if (isFound) cellStyle = 'bg-green-500 text-white border-green-600'; 
                    if (isSelected) cellStyle = 'bg-yellow-400 text-black border-yellow-500 scale-95 shadow-inner'; // Corrected style

                    return (
                      <div key={cellId} onClick={() => handleCellClick(r, c)}
                        className={`w-7 h-7 sm:w-10 sm:h-10 flex items-center justify-center text-base sm:text-xl font-bold rounded-md cursor-pointer transition-all duration-150 border-2 border-gray-200 ${cellStyle}`}>
                        {char}
                      </div>
                    );
                  })
                ))}
              </div>
            </div>
            {/* List Area */}
            <div className="flex-grow w-full md:w-auto md:max-w-xs">
              <div className="bg-white p-5 rounded-xl border-4 border-gray-900 shadow-sm h-full">
                 <h3 className="font-black text-xl mb-4 text-center text-gray-700 border-b-2 border-gray-100 pb-2">目標詞語</h3>
                 <div className="grid grid-cols-2 md:grid-cols-1 gap-3">
                    {activeVocab.map((word, idx) => (
                      <div key={idx} className={`p-3 rounded-xl border-2 border-gray-900 flex items-center justify-between transition-all ${foundWords.includes(word.char) ? 'bg-green-300 opacity-60 scale-95' : 'bg-white shadow-sm'}`}>
                        <span className="font-bold text-lg">{word.char}</span>
                        {foundWords.includes(word.char) && <IconCheck size={20}/>}
                      </div>
                    ))}
                 </div>
              </div>
            </div>
          </div>
        </div>
      );

      const renderLevel2 = () => {
        if (!activeVocab.length) return null;
        const currentWord = activeVocab[quizIndex];
        const otherCandidates = activeVocab.filter(w => w.english !== currentWord.english);
        const safeOthers = otherCandidates.sort(() => 0.5 - Math.random()).slice(0, 3);
        while (safeOthers.length < 3 && activeVocab.length < 4) break; 
        const options = [currentWord, ...safeOthers].sort(() => 0.5 - Math.random());
        return (
          <div className="flex flex-col items-center max-w-2xl mx-auto w-full">
            <div className={`${COLORS.highlight} ${BORDER_STYLE} px-6 py-2 mb-6`}>
               <span className="text-2xl font-black">第二關：意思配對</span>
            </div>
            <div className="w-full bg-white border-4 border-gray-900 rounded-3xl p-8 mb-8 text-center relative overflow-hidden">
              <div className="absolute top-0 left-0 w-full h-4 bg-gray-200">
                <div className="h-full bg-green-400 transition-all duration-500" style={{width: `${(quizIndex / activeVocab.length) * 100}%`}} />
              </div>
              <div className="mt-8 mb-4">
                <span className="text-6xl font-black text-gray-800 block mb-2">{currentWord.char}</span>
                <span className="text-xl text-gray-500 font-bold font-mono">{currentWord.jyutping}</span>
              </div>
              <button onClick={() => speakCantonese(currentWord.char)} className="mx-auto bg-gray-100 rounded-full p-3 hover:bg-gray-200 transition-colors">
                <IconVolume size={24} />
              </button>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 w-full">
              {options.map((opt, idx) => (
                <button key={idx} onClick={() => handleQuizAnswer(opt.english)} className={`${BUTTON_STYLE} ${COLORS.bg} hover:bg-yellow-200 text-lg`}>
                  {opt.english}
                </button>
              ))}
            </div>
          </div>
        );
      };

      const renderLevel3 = () => {
        if (!activeVocab.length) return null;
        const currentWord = activeVocab[dialogueIndex];
        return (
          <div className="flex flex-col items-center max-w-2xl mx-auto w-full">
            <div className={`${COLORS.accent} ${BORDER_STYLE} px-6 py-2 mb-6`}>
               <span className="text-2xl font-black">第三關：造句翻譯</span>
            </div>
            <div className="w-full bg-white border-4 border-gray-900 rounded-3xl p-6 min-h-[400px] flex flex-col justify-between relative shadow-lg">
              <div className="flex gap-4 items-start mb-8">
                <div className="w-12 h-12 rounded-full bg-blue-500 border-2 border-black flex items-center justify-center flex-shrink-0">
                  <span className="text-2xl">🤖</span>
                </div>
                <div className="bg-blue-100 border-2 border-black p-4 rounded-2xl rounded-tl-none relative w-full">
                   <p className="font-bold text-lg mb-2">請用「<span className="text-pink-600">{currentWord.char}</span>」寫出如下句子：</p>
                   <div className="bg-white p-3 rounded-lg border-2 border-blue-200 font-bold text-gray-700 text-lg">
                     {currentWord.prompt}
                   </div>
                </div>
              </div>
              <div className="mt-auto">
                 {dialogueFeedback === "wrong" && (
                    <div className="mb-2 text-red-500 font-bold bg-red-50 p-2 rounded border border-red-200 text-center animate-pulse">
                      {feedbackMsg || `記得使用「${currentWord.char}」翻譯喔！`}
                    </div>
                 )}
                 {dialogueFeedback === "correct" && (
                    <div className="mb-2 text-green-600 font-bold bg-green-50 p-2 rounded border border-green-200 text-center flex items-center justify-center gap-2">
                      <IconStar className="fill-current text-yellow-400"/> 好棒！Excellent!
                    </div>
                 )}
                <div className="flex gap-2">
                   <input type="text" value={dialogueInput} onChange={(e) => setDialogueInput(e.target.value)}
                     placeholder={`請輸入包含「${currentWord.char}」的句子...`}
                     className="flex-grow border-4 border-gray-900 rounded-xl p-3 text-lg font-bold outline-none focus:border-pink-400 transition-colors"
                     onKeyPress={(e) => e.key === 'Enter' && handleDialogueSubmit()}
                   />
                   <button onClick={handleDialogueSubmit} className={`${COLORS.primary} ${BUTTON_STYLE} px-4 py-0`}>
                     <IconArrowRight />
                   </button>
                </div>
              </div>
            </div>
          </div>
        );
      };

      const renderVictory = () => {
        return (
        <div className="text-center animate-bounce-in relative">
           <div className="fixed inset-0 pointer-events-none z-0 overflow-hidden">
              {[...Array(50)].map((_, i) => (
                <div key={i} className="absolute w-4 h-4 rounded-sm"
                  style={{
                    left: `${Math.random() * 100}%`,
                    top: '-20px',
                    backgroundColor: ['#FFC0CB', '#FFD700', '#87CEEB', '#90EE90', '#FF69B4'][Math.floor(Math.random() * 5)],
                    animation: `fall ${Math.random() * 3 + 2}s linear infinite`,
                    animationDelay: `${Math.random() * 5}s`
                  }}
                />
              ))}
              <style>{`@keyframes fall { 0% { transform: translateY(-20px) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }`}</style>
           </div>
           <div className="relative z-10 bg-white/90 p-8 sm:p-12 rounded-3xl border-4 border-gray-900 shadow-xl backdrop-blur-sm max-w-2xl mx-auto mt-10">
             <div className="mb-8 relative inline-block">
                <IconTrophy className="text-yellow-400 fill-current drop-shadow-lg" size={120} />
                <IconStar className="text-pink-400 fill-current absolute -top-2 -right-4 animate-spin-slow" size={40} />
                <IconStar className="text-blue-400 fill-current absolute bottom-0 -left-6 animate-pulse" size={30} />
             </div>
             <h2 className="text-6xl font-black text-gray-900 mb-6 tracking-tight">通關成功！</h2>
             <p className="text-3xl font-bold text-gray-600 mb-10">你真係好叻呀！<br/><span className="text-xl text-gray-400 mt-2 block">(You are amazing!)</span></p>
             <div className="flex gap-4 justify-center flex-wrap">
               <button onClick={handleRestart} className={`${COLORS.accent} ${BUTTON_STYLE} flex gap-2 items-center text-xl`}>
                 <IconRefresh /> 再玩一次
               </button>
               <button onClick={() => setMode('editor')} className={`${COLORS.secondary} ${BUTTON_STYLE} flex gap-2 items-center text-xl`}>
                 <IconEdit /> 編輯內容
               </button>
             </div>
           </div>
        </div>
        );
      };

      return (
        <div className={`min-h-screen ${COLORS.bg} font-sans text-gray-800 p-4`}>
          {mode === 'game' && (
            <div className="flex justify-between items-center max-w-4xl mx-auto mb-6">
              <button onClick={() => setMode('editor')} className="p-2 bg-white rounded-full border-2 border-black hover:bg-gray-100">
                <IconSettings size={20}/>
              </button>
              <div className="font-black text-xl tracking-widest text-gray-400">粵語小學堂</div>
              <div className="w-10"></div>
            </div>
          )}
          {mode === 'editor' && renderEditor()}
          {mode === 'game' && (
            <div className="max-w-4xl mx-auto">
              {view === 'welcome' && renderWelcome()}
              {showTransition && renderTransition()}
              {view === 'game' && !showTransition && (
                <>
                   {gameLevel === 1 && renderLevel1()}
                   {gameLevel === 2 && renderLevel2()}
                   {gameLevel === 3 && renderLevel3()}
                   {gameLevel === 4 && renderVictory()}
                </>
              )}
            </div>
          )}
          <div className="mt-12 mb-4 text-center text-gray-400 font-bold text-sm tracking-widest font-sans">
            Chinese with Dora | Dora 老师
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
